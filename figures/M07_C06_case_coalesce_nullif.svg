<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Catégoriser : CASE, COALESCE, NULLIF</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Trois outils de transformation : etiqueter (CASE), replier les absences (COALESCE),</text><text x="20" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">produire des absences (NULLIF). Syntaxe standard : DuckDB, PostgreSQL, SQLite identiques.</text><rect x="20" y="84" width="240" height="40" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">montant_ttc</text><text x="36" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">(50 008 ventes)</text><line x1="270" y1="104" x2="320" y2="104" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="330" y="80" width="130" height="50" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1"/><text x="346" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">CASE</text><text x="346" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">WHEN / ELSE</text><line x1="470" y1="104" x2="484" y2="82" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="490" y="70" width="120" height="26" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/><text x="500" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">&lt; 50 000</text><rect x="618" y="70" width="152" height="26" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="628" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">a) 12 753 ventes</text><line x1="470" y1="104" x2="484" y2="120" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="490" y="108" width="120" height="26" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/><text x="500" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">&lt; 200 000</text><rect x="618" y="108" width="152" height="26" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="628" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">b) 21 509 ventes</text><line x1="470" y1="104" x2="484" y2="158" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="490" y="146" width="120" height="26" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/><text x="500" y="164" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">sinon (ELSE)</text><rect x="618" y="146" width="152" height="26" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="628" y="164" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">c) 15 746 ventes</text><text x="36" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Total des 3 tranches : 12 753 + 21 509 + 15 746 = 50 008 (controle)</text><rect x="20" y="210" width="350" height="84" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="36" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">COALESCE(a, b, ...) : la 1re non NULL</text><text x="36" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">COALESCE(ville, '(non renseignee)')</text><text x="36" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">-&gt; ville si presente, sinon le repli</text><text x="36" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">Ne regarde QUE les NULL (pas 0, pas vide).</text><rect x="390" y="210" width="370" height="84" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="406" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">NULLIF(a, b) : NULL si a = b, sinon a</text><text x="406" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">NULLIF(plafond, 0)  -&gt;  le 0 devient NULL</text><text x="406" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">COALESCE(NULLIF(x, 0), -1)  -&gt;  vider puis replier</text><text x="406" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">Le miroir de COALESCE : il produit le NULL.</text><rect x="20" y="312" width="740" height="76" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Regles du CASE</text><text x="36" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Toujours un ELSE (sinon NULL sur les non couverts).  2. Les WHEN sont testes dans l'ordre.</text><text x="36" y="376" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Tranches disjointes : borne haute seulement (&lt; 50 000, &lt; 200 000, sinon).</text><text x="36" y="396" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Meme type des deux cotes du COALESCE (pas de nombre et de texte melanges).</text></svg>