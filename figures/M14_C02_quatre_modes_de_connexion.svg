   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(25.85952 129.829946)">aussi fraiche que la</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #222222" transform="translate(25.85952 139.264087)">derniere actualisation</text>
   </g>
   <g id="text_9">
