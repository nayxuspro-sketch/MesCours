   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b1b1b" x="219.24" y="18.167891" transform="rotate(-0 219.24 18.167891)">Quatre facons de brancher la donnee sur un rapport</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="219.24" y="28.992411" transform="rotate(-0 219.24 28.992411)">la question n'est jamais « quel mode est le meilleur », mais « quelle fraicheur ce rapport exige »</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2f7d4f" x="66.5712" y="52.444162" transform="rotate(-0 66.5712 52.444162)">Import</text>
