<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Les 4 types de base : la famille autorise les operations</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">type(x) dit la famille ; la famille decide ce qui passe et ce qui proteste.</text><text x="20" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">Type</text><text x="150" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">+ (addition)</text><text x="320" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">comparaison</text><text x="480" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">conversion</text><text x="620" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">en condition</text><rect x="20" y="92" width="740" height="2" rx="0" fill="#c9d3dd" stroke="#c9d3dd" stroke-width="1"/><rect x="20" y="100" width="740" height="50" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="24" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">int</text><text x="150" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1500 + 500 = 2000</text><text x="150" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">17 // 5 = 3 · 17 % 5 = 2</text><text x="320" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1500 &lt; 2000 → True</text><text x="320" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1000 &lt;= 1200 &lt; 1500 (chaînée)</text><text x="480" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">int('1500') → 1500</text><text x="480" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">str(1500) → '1500'</text><text x="620" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1500 → True</text><text x="620" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">0 → False (le piège du if)</text><rect x="20" y="160" width="740" height="50" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="24" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2f5d8a" text-anchor="start" font-weight="600">float</text><text x="150" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1500.5 + 0.5 = 1501.0</text><text x="150" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">500 * 1.19 = 595.0 (TVA 2026)</text><text x="320" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1500.5 &lt; 2000 → True</text><text x="320" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">0.1 + 0.2 != 0.3 (approximatif)</text><text x="480" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">float('1500.5') → 1500.5</text><text x="480" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">le point, pas la virgule</text><text x="620" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">1500.5 → True</text><text x="620" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">0.0 → False</text><rect x="20" y="220" width="740" height="50" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="24" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">str</text><text x="150" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">'15' + '00' = '1500' (concat.)</text><text x="150" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">pas d'addition de nombres</text><text x="320" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">'Ouaga' &lt; 'Bobo' → True (alpha)</text><text x="320" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">la casse compte : 'A' &lt; 'a'</text><text x="480" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#b3541e" text-anchor="start" font-weight="600">int('1500,50') → ValueError</text><text x="480" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">recette : replace puis float</text><text x="620" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">'x' → True (texte non vide)</text><text x="620" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">'' → False (texte vide)</text><rect x="20" y="280" width="740" height="50" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="24" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5b7fa6" text-anchor="start" font-weight="600">bool</text><text x="150" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">and · or · not (pas de +)</text><text x="150" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">priorité : not, and, or (comme SQL)</text><text x="320" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">True == True → True</text><text x="320" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">True == 1 → True (attention)</text><text x="480" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">bool(0) → False</text><text x="480" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">bool(1500) → True</text><text x="620" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">True / False</text><text x="620" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">le if les lit directement</text><rect x="20" y="340" width="740" height="34" rx="4" fill="#f4f7fa" stroke="#8fa3b5" stroke-width="1" stroke-dasharray="5 3"/><text x="24" y="362" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#42566b" text-anchor="start" font-weight="600">list · tuple · dict · set</text><text x="190" y="362" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">les conteneurs — C04 : des listes de ces 4 types, des clés vers valeurs</text><rect x="20" y="386" width="740" height="100" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="36" y="408" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Les 4 protestations du débutant (C02 §5.6) — le nom de la famille d'abord :</text><text x="36" y="428" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">SyntaxError — le texte ne se lit pas (deux-points manquant)</text><text x="36" y="444" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">NameError — le nom n'existe pas (montannt, ou cellule Jupyter non exécutée)</text><text x="36" y="460" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">TypeError — mauvaise famille (1500 + 'abc')</text><text x="36" y="476" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">ValueError — mauvaise valeur (int('1500,50'))</text></svg>