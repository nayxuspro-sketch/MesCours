<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><rect x="6" y="8" width="462" height="236" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Le TCD de l’atelier, écrit à la main</text><text x="18" y="47" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">feuille TCD : sept catégories, cinq mesures, une ligne de total</text><text x="18" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start" font-weight="600">categorie</text><text x="140" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="end" font-weight="600">lignes</text><text x="212" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="end" font-weight="600">CA (FCFA)</text><text x="296" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="end" font-weight="600">moy./ligne</text><text x="368" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="end" font-weight="600">part</text><text x="424" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="end" font-weight="600">remises</text><line x1="14" y1="76" x2="460" y2="76" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Plomberie</text><text x="140" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">57</text><text x="212" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">8 754 982</text><text x="296" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">153 596</text><text x="368" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">24,3 %</text><text x="424" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="end">22</text><text x="18" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Matériaux</text><text x="140" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">143</text><text x="212" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">6 519 357</text><text x="296" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">45 590</text><text x="368" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">18,1 %</text><text x="424" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="end">49</text><text x="18" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Electricité</text><text x="140" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">53</text><text x="212" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">6 311 645</text><text x="296" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">119 088</text><text x="368" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">17,5 %</text><text x="424" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="end">21</text><text x="18" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Bois &amp; panneaux</text><text x="140" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">24</text><text x="212" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">4 844 758</text><text x="296" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">201 865</text><text x="368" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">13,4 %</text><text x="424" y="145" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="end">10</text><text x="18" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Consommables</text><text x="140" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">57</text><text x="212" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">2 500 964</text><text x="296" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">43 877</text><text x="368" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">6,9 %</text><text x="424" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="end">18</text><rect x="14" y="166" width="446" height="18" rx="3" fill="#eef3f8" stroke="#dce6f0" stroke-width="1"/><text x="18" y="179" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="start" font-weight="600">Total</text><text x="140" y="179" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">480</text><text x="212" y="179" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">36 073 185</text><text x="296" y="179" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">75 152</text><text x="368" y="179" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">100,0 %</text><text x="424" y="179" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="end">173</text><rect x="14" y="191" width="446" height="44" rx="4" fill="#fffaf2" stroke="#e8d9bd" stroke-width="1"/><text x="22" y="206" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">« Le TOTAL de la ligne CA doit être exactement le total de la feuille :</text><text x="22" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start" font-weight="600">s’il diffère d’un centime, un filtre est resté actif quelque part. »</text><rect x="476" y="8" width="298" height="236" rx="4" fill="#fdf7f4" stroke="#e3c9bd" stroke-width="1"/><text x="488" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Ce que le TCD simple ne peut pas faire</text><text x="488" y="47" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">la demande : des clients distincts, pas des lignes</text><text x="488" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">champ Valeurs = Nombre sur [client]</text><text x="488" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a83232" text-anchor="start" font-weight="600">480 : ce sont les lignes</text><text x="488" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">somme des sept cases « clients »</text><text x="488" y="124" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a83232" text-anchor="start" font-weight="600">384, pas 372</text><text x="488" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">vraie valeur distincte, toute la table</text><text x="488" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a83232" text-anchor="start" font-weight="600">372 clients</text><rect x="484" y="182" width="282" height="60" rx="4" fill="#ffffff" stroke="#e3c9bd" stroke-width="1"/><text x="492" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#3f7d3f" text-anchor="start">la case « Ajouter ces données au modèle de</text><text x="492" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#3f7d3f" text-anchor="start" font-weight="600">données » débloque « Nombre distincts »</text><text x="492" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#3f7d3f" text-anchor="start">— et elle n’existe pas sur Excel pour Mac</text><rect x="6" y="252" width="768" height="210" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Le modèle de données : des relations au lieu de colonnes recopiées</text><rect x="24" y="292" width="168" height="56" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.6"/><text x="34" y="312" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">ventes</text><text x="34" y="328" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">480 lignes · 13 colonnes</text><text x="34" y="341" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#8a99a8" text-anchor="start">une seule table de faits</text><rect x="430" y="288" width="200" height="28" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="438" y="301" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">produits</text><text x="438" y="312" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#8a99a8" text-anchor="start">154 lignes · prix catalogue</text><line x1="192" y1="316" x2="426" y2="302" stroke="#8a99a8" stroke-width="1.4" marker-end="url(#f)"/><rect x="430" y="320" width="200" height="28" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="438" y="333" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">clients</text><text x="438" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#8a99a8" text-anchor="start">23 500 au référentiel · 103 lignes sans clé</text><line x1="192" y1="316" x2="426" y2="334" stroke="#8a99a8" stroke-width="1.4" marker-end="url(#f)"/><rect x="430" y="352" width="200" height="28" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="438" y="365" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">magasins</text><text x="438" y="376" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#8a99a8" text-anchor="start">6 magasins · ville, région, ouverture</text><line x1="192" y1="316" x2="426" y2="366" stroke="#8a99a8" stroke-width="1.4" marker-end="url(#f)"/><rect x="430" y="384" width="200" height="28" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="438" y="397" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">objectifs</text><text x="438" y="408" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#8a99a8" text-anchor="start">218 lignes · 2 lignes de vente sans cible</text><line x1="192" y1="316" x2="426" y2="398" stroke="#8a99a8" stroke-width="1.4" marker-end="url(#f)"/><rect x="24" y="372" width="288" height="74" rx="4" fill="#ffffff" stroke="#cfe0cf" stroke-width="1"/><text x="34" y="388" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#3f7d3f" text-anchor="start" font-weight="600">Trois mesures DAX, dans Power Pivot</text><text x="34" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">CA       ← =SUM(ventes[montant_ttc])</text><text x="34" y="418" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">Clients  ← =DISTINCTCOUNT(ventes[client])</text><text x="34" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">Part     ← =DIVIDE([CA];[CA objectif])</text><text x="18" y="456" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">relations : produit → id_produit · client → id_client · magasin → id_magasin · objectifs → annee_mois</text><rect x="660" y="288" width="106" height="158" rx="4" fill="#eef3f8" stroke="#dce6f0" stroke-width="1"/><text x="668" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="start" font-weight="600">au lieu de</text><text x="668" y="320" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">7 colonnes</text><text x="668" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">RECHERCHEV</text><text x="668" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">recopiées</text><text x="668" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#8a99a8" text-anchor="start">sur 480 lignes</text><text x="668" y="382" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#8a99a8" text-anchor="start">et à ressaisir</text><text x="668" y="396" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#8a99a8" text-anchor="start">à chaque import</text><text x="668" y="418" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start" font-weight="600">1 relation</text><text x="668" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start" font-weight="600">= 0 formule</text></svg>