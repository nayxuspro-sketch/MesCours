<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Pipeline ORDER BY + LIMIT + OFFSET</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le tri (7e) precede la troncature (8e) ; OFFSET est la cle de la pagination.</text><rect x="20" y="70" width="740" height="32" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Ordre d'execution : FROM -&gt; WHERE -&gt; GROUP BY -&gt; HAVING -&gt; SELECT -&gt; DISTINCT -&gt; ORDER BY -&gt; LIMIT</text><rect x="20" y="120" width="240" height="32" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="32" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">ORDER BY</text><text x="100" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">trier</text><text x="32" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">ASC par defaut</text><text x="32" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ORDER BY col ASC</text><text x="32" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ORDER BY col DESC</text><text x="32" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ORDER BY a, b   (multi-cles)</text><text x="32" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ORDER BY alias_colonne</text><text x="32" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ORDER BY 2         (position)</text><rect x="270" y="120" width="240" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="282" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">LIMIT</text><text x="350" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">tronquer</text><text x="282" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">garder N lignes</text><text x="282" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">LIMIT 5              (5 premieres)</text><text x="282" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">LIMIT 10 OFFSET 20  (page 3)</text><text x="282" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">LIMIT 1             (top 1)</text><text x="282" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">LIMIT ALL           (tout)</text><text x="282" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">OFFSET seul         (rare)</text><rect x="520" y="120" width="240" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="532" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">OFFSET</text><text x="600" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">sauter</text><text x="532" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">avant LIMIT</text><text x="532" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">OFFSET 10           (sauter 10)</text><text x="532" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">OFFSET 100          (sauter 100)</text><text x="532" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">OFFSET 1000         (sauter 1000)</text><text x="532" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Dangereux sur &gt; 1M  (lent)</text><text x="532" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Pagine par cle en M11 (rapide)</text><rect x="20" y="410" width="740" height="60" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Pieges</text><text x="36" y="452" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">LIMIT sans ORDER BY -&gt; ordre arbitraire (non deterministe)</text></svg>