<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">L'ordre reel d'execution d'une requete SQL</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">La machine traite les clauses dans cet ordre, PAS dans l'ordre d'ecriture.</text><rect x="20" y="80" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><rect x="70" y="80" width="130" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="80" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">FROM</text><text x="210" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">charger la table</text><line x1="38" y1="114" x2="38" y2="122" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="118" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text><rect x="70" y="118" width="130" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="80" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">WHERE</text><text x="210" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">filtrer les lignes (avant agregat)</text><line x1="38" y1="152" x2="38" y2="160" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="156" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text><rect x="70" y="156" width="130" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="80" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">GROUP BY</text><text x="210" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">regrouper les lignes partageant ...</text><line x1="38" y1="190" x2="38" y2="198" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="194" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="216" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">4</text><rect x="70" y="194" width="130" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="80" y="216" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">HAVING</text><text x="210" y="216" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">filtrer les groupes (apres agregat)</text><line x1="38" y1="228" x2="38" y2="236" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="232" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">5</text><rect x="70" y="232" width="130" height="32" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="80" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">SELECT</text><text x="210" y="254" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">choisir les colonnes / expressions</text><line x1="38" y1="266" x2="38" y2="274" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="270" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">6</text><rect x="70" y="270" width="130" height="32" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="80" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">DISTINCT</text><text x="210" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">dedoublonner les lignes</text><line x1="38" y1="304" x2="38" y2="312" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="308" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">7</text><rect x="70" y="308" width="130" height="32" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="80" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">ORDER BY</text><text x="210" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">trier les lignes du resultat</text><line x1="38" y1="342" x2="38" y2="350" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="346" width="36" height="32" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/><text x="38" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">8</text><rect x="70" y="346" width="130" height="32" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="80" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">LIMIT</text><text x="210" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">tronquer (OFFSET pour paginer)</text><rect x="20" y="400" width="740" height="70" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="422" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">90 % des erreurs SQL viennent d'un malentendu sur cet ordre.</text><text x="36" y="442" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">On ecrit SELECT en premier ; la machine le traite en 5e position.</text><text x="36" y="458" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Un alias de SELECT n'existe pas encore au moment du WHERE : erreur 'column does not exist'.</text></svg>