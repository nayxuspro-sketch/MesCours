<svg xmlns="http://www.w3.org/2000/svg" width="760" height="314" viewBox="0 0 760 314" font-family="DejaVu Sans"><rect width="760" height="314" fill="#ffffff"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4653"/></marker></defs><text x="10" y="18" font-size="13.5" font-weight="bold" fill="#1c2430" text-anchor="start">Deux classements, pas un seul</text><rect x="10" y="34" width="160" height="24" rx="6" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.9"/><text x="90.0" y="50.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">STRUCTURÉE</text><text x="182" y="50" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">les 10 fichiers du socle : CSV, XLSX</text><rect x="10" y="80" width="160" height="24" rx="6" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.9"/><text x="90.0" y="96.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">SEMI-STRUCTURÉE</text><text x="182" y="96" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">JSON des logs de caisse, XML d'un export Sage, e-mails</text><rect x="10" y="126" width="160" height="24" rx="6" fill="#fdf3dd" stroke="#3c4653" stroke-width="0.9"/><text x="90.0" y="142.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">NON STRUCTURÉE</text><text x="182" y="142" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">SMS du commercial, photo d'un bon, PDF du fournisseur</text><line x1="10" y1="172" x2="750" y2="172" stroke="#c3ccd8"/><rect x="10" y="184" width="250" height="24" rx="6" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.9"/><text x="135.0" y="200.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">QUANTITATIVE : on peut calculer</text><text x="20" y="226" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">discrète : quantite (11, 2, 2 000 — jamais 1,5)</text><text x="20" y="241" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">continue : poids_kg, taux_remise (0,032)</text><rect x="278" y="184" width="250" height="24" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="403.0" y="200.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">QUALITATIVE : on peut classer</text><text x="288" y="226" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">nominale : categorie (aucun ordre)</text><text x="288" y="241" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">ordinale : type_client (ordre connu)</text><rect x="546" y="184" width="204" height="24" rx="6" fill="#fdf3dd" stroke="#3c4653" stroke-width="0.9"/><text x="648.0" y="200.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">LE TEST QUI CLASSE</text><text x="556" y="226" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">« 2 catégories valent-elles</text><text x="556" y="241" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">2 fois l'autre ? » sinon, ce</text><text x="556" y="254" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">n'est pas une échelle ratio.</text><text x="10" y="276" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="start">Ce que la colonne EST décide ce que vous avez le DROIT de calculer.</text><text x="474" y="276" font-size="10" font-weight="normal" fill="#41505f" text-anchor="start">la moyenne d'une nominale est un non-sens</text><text x="8" y="305" font-size="11" fill="#6a7382">Figure 5 — Classer les colonnes du socle, c'est déjà savoir quels calculs seront licites au module 2.</text></svg>