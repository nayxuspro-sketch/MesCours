<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Le langage commun : 10 opérations, 4 classes, 3 moteurs</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le pipeline se décrit en 10 verbes exécutés par Power Query, SQL DuckDB ou pandas.</text><rect x="60" y="90" width="160" height="30" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/><text x="68" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">M — manipulation</text><rect x="60" y="128" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="68" y="143" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">extraire</text><rect x="60" y="154" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="68" y="169" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">convertir</text><rect x="60" y="180" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="68" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">renommer</text><rect x="60" y="206" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="68" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">réparer</text><rect x="240" y="90" width="160" height="30" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="2"/><text x="248" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Op — opérateurs</text><rect x="240" y="128" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="248" y="143" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">projet</text><rect x="240" y="154" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="248" y="169" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">filtre</text><rect x="240" y="180" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="248" y="195" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">tri</text><rect x="240" y="206" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="248" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">jointure</text><rect x="420" y="90" width="160" height="30" rx="4" fill="#ffffff" stroke="#3f7d3f" stroke-width="2"/><text x="428" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#3f7d3f" text-anchor="start" font-weight="600">P — paramètres</text><rect x="420" y="128" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="428" y="143" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">paramètres</text><rect x="600" y="90" width="160" height="30" rx="4" fill="#ffffff" stroke="#5b3a8e" stroke-width="2"/><text x="608" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#5b3a8e" text-anchor="start" font-weight="600">Ag — agrégations</text><rect x="600" y="128" width="160" height="22" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="608" y="143" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">agréger</text><rect x="20" y="320" width="740" height="130" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="36" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Trois moteurs, une même grammaire</text><text x="60" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">Power Query</text><text x="60" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Excel M · clic + formule</text><text x="320" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">SQL DuckDB</text><text x="320" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">SELECT ... FROM v</text><text x="580" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">pandas</text><text x="580" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">df.assign(...).query(...)</text><text x="36" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Le même pipeline produit la même table dans les trois moteurs :</text><text x="36" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">mars = 6 884 lignes, total 464 096 003 FCFA, 101 enrichies, empreinte sha256 identique.</text></svg>