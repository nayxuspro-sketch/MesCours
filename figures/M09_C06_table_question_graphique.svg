<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" width="780" height="570"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Le graphique se choisit PAR QUESTION — la table du module (tout est exécuté)</text><text x="20" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Pas un graphique « joli », celui qui répond. La légende : question + source + n + axe déclaré s'il n'est pas à zéro.</text><text x="36" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">QUESTION</text><text x="330" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="middle" font-weight="600">GLYPHE</text><text x="480" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">RÉPONSE (sortie exécutée)</text><rect x="20" y="86" width="740" height="2" rx="0" fill="#c9d3dd" stroke="#c9d3dd" stroke-width="1"/><rect x="20" y="100" width="740" height="54" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1"/><text x="36" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">Ca monte, ça descend, ça cycle ?</text><text x="36" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">courbe (+ bâche)</text><path d="M292,140 L306,122 L320,132 L334,116 L348,126 L368,112" fill="none" stroke="#c96a1a" stroke-width="1.6"/><path d="M292,130 L368,122" stroke="#1f4e79" stroke-width="2.2"/><text x="480" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">CA mensuel 307-348 M, mg3 320-337 M</text><text x="480" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">plat, +1.6 % à mois égal (déclaré)</text><rect x="20" y="162" width="740" height="54" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1"/><text x="36" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">Les groupes se comparent-ils ?</text><text x="36" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">barres (+ les n)</text><rect x="294" y="176" width="11" height="26" rx="1" fill="#1f4e79" stroke="#1f4e79" stroke-width="0"/><rect x="310" y="178" width="11" height="24" rx="1" fill="#1f4e79" stroke="#1f4e79" stroke-width="0"/><rect x="326" y="175" width="11" height="27" rx="1" fill="#1f4e79" stroke="#1f4e79" stroke-width="0"/><rect x="342" y="179" width="11" height="23" rx="1" fill="#1f4e79" stroke="#1f4e79" stroke-width="0"/><rect x="358" y="174" width="11" height="28" rx="1" fill="#1f4e79" stroke="#1f4e79" stroke-width="0"/><text x="480" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">panier par mode : écart 2.4 %</text><text x="480" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">n de 2 552 à 20 175 : c'est le bruit</text><rect x="20" y="224" width="740" height="54" rx="4" fill="#f0f4ee" stroke="#9db88f" stroke-width="1"/><text x="36" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">La dispersion change par groupe ?</text><text x="36" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">boxplot</text><rect x="297" y="242" width="14" height="22" rx="1" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/><line x1="304" y1="236" x2="304" y2="270" stroke="#1f4e79"/><line x1="294" y1="236" x2="314" y2="236" stroke="#1f4e79"/><line x1="294" y1="270" x2="314" y2="270" stroke="#1f4e79"/><rect x="323" y="242" width="14" height="22" rx="1" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/><line x1="330" y1="236" x2="330" y2="270" stroke="#1f4e79"/><line x1="320" y1="236" x2="340" y2="236" stroke="#1f4e79"/><line x1="320" y1="270" x2="340" y2="270" stroke="#1f4e79"/><rect x="349" y="242" width="14" height="22" rx="1" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/><line x1="356" y1="236" x2="356" y2="270" stroke="#1f4e79"/><line x1="346" y1="236" x2="366" y2="236" stroke="#1f4e79"/><line x1="346" y1="270" x2="366" y2="270" stroke="#1f4e79"/><text x="480" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">notes par segment : médianes</text><text x="480" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">11.21 / 10.40 / 9.51 : un gradient</text><rect x="20" y="286" width="740" height="54" rx="4" fill="#fff7f0" stroke="#d99a6c" stroke-width="1"/><text x="36" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">Quelle est la forme de la variable ?</text><text x="36" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">histogramme</text><rect x="294" y="318" width="8" height="8" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="304" y="310" width="8" height="16" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="314" y="300" width="8" height="26" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="324" y="292" width="8" height="34" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="334" y="302" width="8" height="24" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="344" y="314" width="8" height="12" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="354" y="320" width="8" height="6" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><rect x="364" y="322" width="8" height="4" rx="0" fill="#c96a1a" stroke="#c96a1a" stroke-width="0"/><text x="480" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">montants 762.63 à 594 363 (ratio ~780)</text><text x="480" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">plateau x6 au maximum (plafond)</text><rect x="20" y="348" width="740" height="54" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1"/><text x="36" y="370" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">Bougent-elles ensemble ?</text><text x="36" y="388" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">nuage (+ le n)</text><circle cx="314" cy="375" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="302" cy="371" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="301" cy="362" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="315" cy="365" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="317" cy="381" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="298" cy="378" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="305" cy="383" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="346" cy="367" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="354" cy="381" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="301" cy="373" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="344" cy="386" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="308" cy="369" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="349" cy="387" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="302" cy="364" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="347" cy="370" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="322" cy="385" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="347" cy="379" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="355" cy="381" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="351" cy="379" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="336" cy="364" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="358" cy="386" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="320" cy="378" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="297" cy="375" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="338" cy="370" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="324" cy="384" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><circle cx="306" cy="374" r="1.8" fill="#1f4e79" fill-opacity="0.45"/><text x="480" y="370" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">montant x taux : corr 0.001 (n=50 008)</text><text x="480" y="388" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start">pas de lien (remise = 45.5 % des ventes)</text><rect x="20" y="428" width="740" height="44" rx="4" fill="#fff0f0" stroke="#d98c8c" stroke-width="1.4"/><text x="36" y="448" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#7a2020" text-anchor="start" font-weight="600">Les 5 contrôles de présentation (la rétro-lecture, dans l'ordre) :</text><text x="36" y="464" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">(1) question dans le TITRE · (2) axe déclaré si non zéro · (3) couleur avec légende · (4) log annoncée · (5) n au titre</text><rect x="20" y="484" width="740" height="76" rx="4" fill="#eef4ea" stroke="#9db88f" stroke-width="1.4"/><text x="36" y="504" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#3d5a2e" text-anchor="start" font-weight="600">Le livrable de fin : la note d'EDA (1 page par jeu) — affirmation + source + limite</text><text x="36" y="522" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#3d5a2e" text-anchor="start">« Le CA est plat sur 24 mois (mg3 320-337 M). Source : G1 exécutée. Limite : décembre 2026 partiel (28 j), exclu. »</text><text x="36" y="538" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3d5a2e" text-anchor="start">La limite se lit à voix haute : si « et sa limite est que … » reste vide, on recule l'affirmation.</text><text x="36" y="554" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3d5a2e" text-anchor="start" font-weight="600">Transition M10 : « Vos résultats sont justes. S'ils sont illisibles, ils ne serviront à rien. »</text></svg>