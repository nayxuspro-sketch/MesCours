<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="DejaVu Sans"><rect width="760" height="280" fill="#ffffff"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4653"/></marker></defs><text x="10" y="18" font-size="13.5" font-weight="bold" fill="#1c2430" text-anchor="start">Le même nombre, deux destins</text><rect x="10" y="30" width="244" height="24" rx="6" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.9"/><text x="132.0" y="46.5" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="middle">montant_ttc écrit en NOMBRE</text><text x="18" y="70" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">56 658</text><text x="18" y="87" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">28 320</text><text x="18" y="104" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">aligné à droite</text><text x="18" y="121" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">SOMME = 84 978 FCFA</text><text x="18" y="138" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">moyenne, tri, graphique : OK</text><rect x="268" y="30" width="244" height="24" rx="6" fill="#fbe9e7" stroke="#3c4653" stroke-width="0.9"/><text x="390.0" y="46.5" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="middle">montant_ttc écrit en TEXTE</text><text x="276" y="70" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">'56 658 </text><text x="276" y="87" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">'28 320 </text><text x="276" y="104" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">aligné à gauche</text><text x="276" y="121" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">SOMME = 0</text><text x="276" y="138" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">tri : 16 520 avant 56 658</text><rect x="526" y="30" width="244" height="24" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="648.0" y="46.5" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="middle">le même défaut, mesuré ici</text><text x="534" y="70" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">486 lignes sur 489 sont du texte</text><text x="534" y="87" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">déguisé en montant</text><text x="534" y="104" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">→ 0,74 % d'écart de total</text><text x="534" y="121" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">18 clients absents</text><text x="534" y="138" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">65 dates au format français</text><line x1="10" y1="160" x2="750" y2="160" stroke="#c3ccd8"/><rect x="10" y="172" width="140" height="22" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="80.0" y="187.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">TEXTE</text><text x="80" y="208" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">vendeur, categorie</text><text x="80" y="221" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">on trie, on regroupe</text><rect x="160" y="172" width="140" height="22" rx="6" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.9"/><text x="230.0" y="187.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">NOMBRE</text><text x="230" y="208" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">quantite, prix_unitaire</text><text x="230" y="221" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">sommes et moyennes</text><rect x="310" y="172" width="140" height="22" rx="6" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.9"/><text x="380.0" y="187.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">DATE</text><text x="380" y="208" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">date (vrai objet-date)</text><text x="380" y="221" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">intervalles, mois</text><rect x="460" y="172" width="140" height="22" rx="6" fill="#fdf3dd" stroke="#3c4653" stroke-width="0.9"/><text x="530.0" y="187.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">BOOLEEN</text><text x="530" y="208" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">est_retour : 0 ou 1</text><text x="530" y="221" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">filtrer les retours</text><rect x="610" y="172" width="140" height="22" rx="6" fill="#fbe9e7" stroke="#3c4653" stroke-width="0.9"/><text x="680.0" y="187.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">MONTANT</text><text x="680" y="208" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">montant_ttc en FCFA</text><text x="680" y="221" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">TVA 18 %, arrondi</text><text x="10" y="242" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="start">Symptômes : total à 0, tri absurde, triangles verts en coin de cellule.</text><text x="8" y="271" font-size="11" fill="#6a7382">Figure 4 — Le défaut n° 1 des fichiers livrés, vu sans calculer et mesuré sur le fichier réel.</text></svg>