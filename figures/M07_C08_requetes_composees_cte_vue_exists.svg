<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Requêtes composées : la question dans la question</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">D'abord calculer, puis utiliser le resultat : sous-requete, CTE nommee, vue enregistree.</text><rect x="20" y="70" width="360" height="110" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="36" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Sous-requete : la question dans la question</text><rect x="36" y="102" width="328" height="34" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="48" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">WHERE montant_ttc &gt;</text><rect x="180" y="102" width="176" height="34" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1"/><text x="192" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">(SELECT AVG(...) FROM vente)</text><text x="36" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1) AVG = 158 140 FCFA  puis  2) filtrer : 20 289 ventes</text><text x="36" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Scalaire = 1 valeur. De liste = un IN (colonne de valeurs).</text><rect x="20" y="196" width="240" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="32" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">CTE (WITH)</text><text x="32" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">sous-requete NOMMEE</text><text x="32" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">ephemere (1 requete)</text><text x="32" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">WITH ca AS (SELECT ...)</text><text x="32" y="302" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">une etape par nom</text><text x="32" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">lisibilite, pas optimisation</text><rect x="270" y="196" width="240" height="32" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="282" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Vue</text><text x="282" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">CTE ENREGISTREE</text><text x="282" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">persiste dans le schema</text><text x="282" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">CREATE VIEW v AS SELECT ...</text><text x="282" y="302" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">lue comme une table</text><text x="282" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">se recalcule (ne fige pas)</text><rect x="520" y="196" width="240" height="32" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="532" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">EXISTS / IN</text><text x="532" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">appartenance</text><text x="532" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">IN = au moins un</text><text x="532" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">IN (SELECT ...)  -&gt;  au moins un</text><text x="532" y="302" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">NOT IN + NULL = 0 ligne (piege)</text><text x="532" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">NOT EXISTS : sans NULL</text><rect x="20" y="400" width="740" height="70" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="422" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Double negation : le pattern des « tous les » (piege P6)</text><text x="36" y="444" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">« le client a achete TOUS les produits X »  =  « il n'existe AUCUN produit X qu'il n'a PAS achete »</text><text x="36" y="462" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">NOT EXISTS (SELECT 1 FROM X WHERE NOT EXISTS (SELECT 1 ...))  -&gt;  119 clients (top 2 produits)</text></svg>