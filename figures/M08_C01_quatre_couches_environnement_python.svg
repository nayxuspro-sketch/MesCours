<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Les 4 couches de l'environnement Python</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Chaque symptome d'installation se rattache a UNE couche — la nommer, c'est diagnostiquer.</text><rect x="300" y="392" width="460" height="74" rx="4" fill="#eef2f6" stroke="#8fa3b5" stroke-width="1.2"/><text x="316" y="416" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#12365a" text-anchor="start" font-weight="600">1 · LA MACHINE</text><text x="316" y="438" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#33475b" text-anchor="start">votre ordinateur : Windows, disque, memoire — on la respecte</text><rect x="300" y="308" width="460" height="78" rx="4" fill="#dbe7f3" stroke="#5b7fa6" stroke-width="1.2"/><text x="316" y="332" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#12365a" text-anchor="start" font-weight="600">2 · L'INTERPRETEUR</text><text x="316" y="354" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#33475b" text-anchor="start">Python 3.13 lit le code ligne a ligne — installe UNE fois, case PATH</text><rect x="300" y="220" width="460" height="82" rx="4" fill="#cfe0f1" stroke="#2f5d8a" stroke-width="1.2"/><text x="316" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#12365a" text-anchor="start" font-weight="600">3 · LES PAQUETS</text><text x="316" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#33475b" text-anchor="start">pip + pandas, numpy… : la couche qui change le plus — c'est ELLE qu'on isole</text><rect x="300" y="128" width="460" height="84" rx="4" fill="#b7d3ec" stroke="#1f4e79" stroke-width="1.2"/><text x="316" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#12365a" text-anchor="start" font-weight="600">4 · LE PROJET</text><text x="316" y="174" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#33475b" text-anchor="start">scripts, donnees, requirements.txt — se versionne (Git) et se partage</text><rect x="292" y="212" width="476" height="98" rx="8" fill="none" stroke="#b3541e" stroke-width="1.6" stroke-dasharray="6 4"/><text x="560" y="205" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#b3541e" text-anchor="middle" font-weight="600">venv — la trousse scellée du projet</text><line x1="360" y1="308" x2="360" y2="302" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><text x="372" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">pip — la boutique (python -m pip install)</text><line x1="530" y1="212" x2="530" y2="220" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><text x="542" y="219" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">le projet importe les paquets</text><text x="20" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Le diagnostic par couche</text><rect x="20" y="118" width="240" height="44" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="32" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">« python n'est pas reconnu »</text><text x="32" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">→ couche 2 : PATH non coche</text><line x1="260" y1="140.0" x2="298" y2="347" stroke="#b3541e" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="172" width="240" height="44" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="32" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">ModuleNotFoundError</text><text x="32" y="206" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">→ couche 3 : mauvaise trousse</text><line x1="260" y1="194.0" x2="298" y2="261" stroke="#b3541e" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="226" width="240" height="44" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="32" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">le notebook ne voit pas</text><text x="32" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">les paquets → couche 3 (noyau)</text><line x1="260" y1="248.0" x2="298" y2="261" stroke="#b3541e" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="280" width="240" height="44" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="32" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">« ca tourne ici, pas</text><text x="32" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">chez lui » → couche 4</text><line x1="260" y1="302.0" x2="298" y2="170" stroke="#b3541e" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="470" width="740" height="24" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="380" y="486" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="middle">Règle : un symptôme = une couche. PATH (2) · trousse (3) · noyau (3) · requirements (4) — dans cet ordre.</text></svg>