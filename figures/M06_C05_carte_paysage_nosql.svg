<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Carte du paysage — 4 familles NoSQL + DWH/lac/lakehouse + 5 mots</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">NoSQL complete le relationnel, ne le remplace pas. Le verdict depend du cas d'usage, pas de la mode.</text><rect x="20" y="80" width="360" height="200" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Les 4 familles NoSQL</text><text x="36" y="124" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Document</text><text x="160" y="124" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">MongoDB, CouchDB</text><text x="36" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Cle-valeur</text><text x="160" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Redis, DynamoDB</text><text x="36" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Graphe</text><text x="160" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Neo4j, JanusGraph</text><text x="36" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Colonnes</text><text x="160" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Cassandra, Bigtable</text><rect x="400" y="80" width="360" height="200" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="416" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Stockage : DWH, lac, lakehouse</text><text x="416" y="124" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Entrepot (DWH)</text><text x="540" y="124" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">donnees validees, analytique</text><text x="416" y="174" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Lac (datalake)</text><text x="540" y="174" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">brut, tout, sans validation</text><text x="416" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Lakehouse</text><text x="540" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">les deux : Delta / Iceberg</text><rect x="20" y="290" width="740" height="110" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="36" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Les 5 mots d'entretien (en moins de 60 mots chacun)</text><text x="36" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Sharding</text><text x="36" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">partition horizontale</text><text x="36" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">irreversible</text><text x="36" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">&gt; 1 To</text><text x="181" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">Replication</text><text x="181" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">copie maitre/esclave</text><text x="181" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">haute disponibilite</text><text x="326" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">CAP</text><text x="326" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">coherence + disponibilite + partition : 2 sur 3</text><text x="471" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">ACID vs BASE</text><text x="471" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">transactionnel strict vs distribue souple</text><text x="616" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">ETL vs ELT</text><text x="616" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="start">transfo hors/dans l'entrepot</text><rect x="20" y="410" width="740" height="50" rx="4" fill="#f2f7f2" stroke="#3f7d3f" stroke-width="1"/><text x="36" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#3f7d3f" text-anchor="start" font-weight="600">Verdict : NoSQL complete le relationnel, ne le remplace pas.</text><text x="36" y="450" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">80 % SQL / 20 % NoSQL : choisir NoSQL quand le relationnel est inadapte, pas par mode.</text></svg>