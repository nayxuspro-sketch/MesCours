<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 452" width="780" height="452"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="6" y="22" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Normaliser n'est pas nettoyer — le gain de chaque colonne, mesuré</text><text x="6" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Gain = valeurs distinctes avant, moins valeurs distinctes après. Une formule à gain nul est un décor.</text><text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Colonne</text><text x="150" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Opération envisagée</text><text x="360" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Avant</text><text x="470" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Après</text><text x="700" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end" font-weight="600">Verdict</text><rect x="6" y="66" width="768" height="40" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">montant_ttc (N)</text><text x="150" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">retirer le suffixe puis les espaces</text><text x="360" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">3 421 textes</text><text x="470" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">3 421 nombres</text><text x="700" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">type · à convertir</text><rect x="6" y="112" width="768" height="40" rx="4" fill="#f2f7f2" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">clients.nom</text><text x="150" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">élaguer, minuscule, ponctuation</text><text x="360" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">12 640</text><text x="470" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">12 342 · gain 298</text><text x="700" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="end">écriture · c'est la clé du C03</text><rect x="6" y="158" width="768" height="40" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">clients.telephone</text><text x="150" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">garder les chiffres seuls</text><text x="360" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">23 499</text><text x="470" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">23 499 · gain 0</text><text x="700" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">écriture · pour la clé, pas l'affichage</text><rect x="6" y="204" width="768" height="40" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">clients.ville</text><text x="150" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">élaguer et harmoniser la casse</text><text x="360" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">6</text><text x="470" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">6 · gain 0</text><text x="700" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">ne pas toucher : formule à retirer</text><rect x="6" y="250" width="768" height="40" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">produits.unite</text><text x="150" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">élaguer et harmoniser la casse</text><text x="360" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">4</text><text x="470" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">4 · gain 0</text><text x="700" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">propre en texte, muette en physique</text><rect x="6" y="296" width="768" height="40" rx="4" fill="#fbe9e7" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">date_vente</text><text x="150" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">aucune conversion à écrire</text><text x="360" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">0 hors norme</text><text x="470" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">51 dates impossibles</text><text x="700" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">le format n'est pas le monde</text><rect x="6" y="342" width="768" height="74" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="359" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">La preuve qui ferme le dossier : deux voies indépendantes, un écart à l'unité</text><text x="16" y="376" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Voie A → somme des 3 421 textes découpés et des 239 939 nombres : 15 639 751 286 FCFA</text><text x="16" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Voie B → somme de (montant_ht + montant_tva) sur les mêmes lignes : 15 639 751 286 FCFA · écart 0</text><text x="16" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Contrôle de rattrapage : les retours à montant positif passent de 47 à 0 sur 2 848 lignes.</text></svg>