ly="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start" font-weight="600">remise</text><text x="326" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start" font-weight="600">montant_ht</text><text x="432" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start" font-weight="600">montant_ttc</text><text x="222" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">0.03</text><text x="328" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">48015</text><text x="434" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">56 658</text><text x="222" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">0.0</text><text x="328" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">43900</text><text x="434" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">51 802</text><rect x="426" y="164" width="106" height="26" rx="4" fill="#fff3cd" stroke="#e0a800" stroke-width="1.6"/><text x="434" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">56 658</text><text x="30" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">la même valeur dans la feuille nettoyée</text><text x="250" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">ventes!M2 : un nombre</text><rect x="426" y="218" width="106" height="26" rx="4" fill="#eaf5ea" stroke="#3f7d3f" stroke-width="1.4"/><text x="524" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="600">56 658 FCFA</text><text x="30" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Feuille ventes_brutes : 489 lignes × 13 colonnes, et pas un seul montant</text><text x="30" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6b7785" text-anchor="start">reconnu comme nombre — d'où « Somme : 0 ». Un texte se colle à gauche,</text><text x="30" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6b7785" text-anchor="start">un nombre à droite : l'alignement est un diagnostic, pas un style.</text><rect x="6" y="306" width="528" height="22" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="14" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Aidez-moi</text><text x="92" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">ventes_brutes</text><text x="186" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">ventes</text><text x="244" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">clients</text><text x="306" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">objectifs</text><text x="378" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Calculs</text><text x="446" y="321" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">TCD</text><rect x="6" y="328" width="528" height="34" rx="4" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="16" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600">Prêt      Nombre : 489      valeurs numériques : 0      Somme : 0</text><rect x="550" y="6" width="202" height="172" rx="4" fill="#fbfdff" stroke="#9fb0c0" stroke-width="1"/><text x="560" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600">Une cellule, trois visages</text><text x="560" y="48" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Son adresse</text><text x="560" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">M2 — lue dans la zone de nom</text><text x="560" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Son contenu</text><text x="560" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">du texte : « 56 658 », pas 56658</text><text x="560" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Son affichage</text><text x="560" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">56 658, collé à gauche</text><text x="560" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start">le format ne change pas le fond</text><rect x="550" y="186" width="202" height="134" rx="4" fill="#f4f9f4" stroke="#3f7d3f" stroke-width="1"/><text x="560" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#3f7d3f" text-anchor="start" font-weight="600">Ce que la barre d'état dit</text><text x="560" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">de la colonne M entière :</text><text x="560" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600">489 textes · Somme : 0</text><text x="560" y="258" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start">un double-clic sur le CSV</text><text x="560" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start">en convertit 3 : 2 444 FCFA</text><text x="560" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start">la feuille ventes, elle :</text><text x="560" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">480 lignes · 36 073 185</text><line x1="300" y1="384" x2="300" y2="366" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><text x="6" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Sélectionnez la colonne M en entier (Ctrl+Maj+Bas) et lisez le bas de l'écran :</text><text x="6" y="410" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">aucun message d'erreur n'apparaîtra — c'est précisément le problème.</text></svg>