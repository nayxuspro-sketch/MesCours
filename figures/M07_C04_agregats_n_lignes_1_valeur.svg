<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Les 5 agregats : de N lignes a 1 valeur</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Chaque agregat consomme un ensemble de valeurs et renvoie une unique valeur.</text><rect x="20" y="66" width="350" height="60" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">50 008 lignes de vente</text><text x="36" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">montant_ttc : 763 a 594 363 FCFA</text><line x1="392" y1="96" x2="448" y2="96" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="450" y="66" width="310" height="60" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1"/><text x="466" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">1 ligne de synthese</text><text x="466" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ca_brut = 7 908 259 731 FCFA</text><rect x="20" y="150" width="144" height="74" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="30" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">COUNT</text><text x="30" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">compter</text><rect x="20" y="194" width="144" height="24" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="30" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">50 008 FCFA</text><rect x="171" y="150" width="144" height="74" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="181" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">SUM</text><text x="181" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">totaliser</text><rect x="171" y="194" width="144" height="24" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="181" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">7 908 259 731 FCFA</text><rect x="322" y="150" width="144" height="74" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="332" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">AVG</text><text x="332" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">moyenner</text><rect x="322" y="194" width="144" height="24" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="332" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">158 140 FCFA</text><rect x="473" y="150" width="144" height="74" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="483" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">MIN</text><text x="483" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">borne basse</text><rect x="473" y="194" width="144" height="24" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="483" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">763 FCFA</text><rect x="624" y="150" width="144" height="74" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="634" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">MAX</text><text x="634" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">borne haute</text><rect x="624" y="194" width="144" height="24" rx="4" fill="#f7fafc" stroke="#9db3c8" stroke-width="1"/><text x="634" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">594 363 FCFA</text><text x="20" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Variante : COUNT(DISTINCT id_client) = 1 200 (valeurs differentes, pas lignes).</text><text x="20" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ROUND : arrondi a la presentation.  ROUND(AVG(montant_ttc), 2) garde 2 decimales.</text><rect x="20" y="286" width="740" height="96" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Regle unique des NULL : tous les agregats ignorent les NULL de leur colonne</text><text x="36" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">COUNT(*)           -&gt; compte les lignes  (les NULL comptent dans le nombre de lignes)</text><text x="36" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">COUNT(col)         -&gt; compte les valeurs non NULL  (colonne 100 % NULL : resultat 0)</text><text x="36" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">SUM / AVG / MIN / MAX  -&gt; ignorent les NULL  (colonne 100 % NULL : resultat NULL, pas 0)</text><text x="36" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">Parade :  COALESCE(SUM(x), 0)   (M07.C06)</text></svg>