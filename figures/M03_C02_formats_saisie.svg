<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><rect x="6" y="6" width="384" height="300" rx="4" fill="#fbfdff" stroke="#c9d3dd" stroke-width="1"/><text x="20" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">Un meme montant, trois traitements</text><text x="32" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">nature de la cellule</text><text x="148" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">la grille affiche</text><text x="264" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="start" font-weight="600">somme de la colonne</text><rect x="24" y="62" width="110" height="34" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="32" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">texte</text><text x="32" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#6b7785" text-anchor="start">SOMME() ignore</text><rect x="140" y="62" width="110" height="34" rx="4" fill="#fff3cd" stroke="#e0a800" stroke-width="1"/><text x="242" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">56 658</text><rect x="256" y="62" width="202" height="34" rx="4" fill="#fff3cd" stroke="#e0a800" stroke-width="1"/><text x="328" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">0</text><rect x="24" y="106" width="110" height="34" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="32" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">nombre</text><text x="32" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#6b7785" text-anchor="start">compte : 480</text><rect x="140" y="106" width="110" height="34" rx="4" fill="#eaf5ea" stroke="#3f7d3f" stroke-width="1"/><text x="242" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">56658</text><rect x="256" y="106" width="202" height="34" rx="4" fill="#eaf5ea" stroke="#3f7d3f" stroke-width="1"/><text x="328" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="600">36 073 185</text><rect x="24" y="150" width="110" height="34" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="32" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">nombre + format</text><text x="32" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#6b7785" text-anchor="start">le format ne change rien</text><rect x="140" y="150" width="110" height="34" rx="4" fill="#eaf5ea" stroke="#3f7d3f" stroke-width="1"/><text x="242" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">56 658 FCFA</text><rect x="256" y="150" width="202" height="34" rx="4" fill="#eaf5ea" stroke="#3f7d3f" stroke-width="1"/><text x="328" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="600">36 073 185</text><rect x="14" y="208" width="368" height="0.6" rx="4" fill="#dde3ea" stroke="#dde3ea" stroke-width="1"/><text x="20" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Sur le fichier recu : 486 montants sur 489</text><text x="20" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">a gauche, 3 a droite. La barre d'etat dit 0,</text><text x="20" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">puis 2 444, puis 36 073 185 : trois etats</text><text x="20" y="276" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">d'un meme fichier, aucun message d'erreur.</text><text x="20" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start">Un format n'est jamais une conversion : la nature du contenu</text><text x="20" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start">se verifie au compteur, pas a l'oeil.</text><rect x="398" y="6" width="352" height="300" rx="4" fill="#fff8f0" stroke="#e0a800" stroke-width="1"/><text x="412" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">Validation : la regle qui arrete 14 000</text><text x="412" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">Autoriser</text><rect x="508" y="41" width="226" height="22" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="516" y="54" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Nombre entier</text><text x="412" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">Donnees</text><rect x="508" y="67" width="226" height="22" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="516" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">comprise entre</text><text x="412" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">Minimum</text><rect x="508" y="93" width="226" height="22" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="516" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1</text><text x="412" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">Maximum</text><rect x="508" y="119" width="226" height="22" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="516" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">500</text><text x="412" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start" font-weight="600">Message d'erreur</text><rect x="508" y="145" width="226" height="22" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="516" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">La quantite doit tenir entre 1 et 500</text><rect x="412" y="190" width="322" height="44" rx="4" fill="#fdecea" stroke="#a1650b" stroke-width="1.4"/><text x="424" y="206" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start" font-weight="600">Attention : 8 lignes de retour portent une</text><text x="424" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">quantite negative, jusqu'a -13. Une regle a 1</text><text x="424" y="234" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">les rejetterait : la regle juste est person-</text><text x="424" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">nalisee, de -500 a 500 pour les retours.</text><text x="412" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Dans le fichier recu : 7 lignes au-dessus de 500,</text><text x="412" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">au maximum 14 000. Apres nettoyage : 68.</text></svg>