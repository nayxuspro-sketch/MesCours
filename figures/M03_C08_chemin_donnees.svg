<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" width="780" height="316"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><rect x="6" y="12" width="176" height="100" rx="4" fill="#fdf7f4" stroke="#e3c9bd" stroke-width="1.3"/><text x="16" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">ventes_brutes.csv</text><text x="16" y="52" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">489 lignes énoncées</text><text x="16" y="67" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">486 montants en texte</text><text x="16" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">dates en texte</text><line x1="186" y1="58" x2="200" y2="58" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="198" y="12" width="176" height="100" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1.3"/><text x="208" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Power Query</text><text x="208" y="52" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">6 étapes appliquées</text><text x="208" y="67" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">dans l’ordre, rejouées</text><text x="208" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">à chaque actualisation</text><line x1="378" y1="58" x2="392" y2="58" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="390" y="12" width="176" height="100" rx="4" fill="#f2f7f2" stroke="#cfe0cf" stroke-width="1.3"/><text x="400" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">modèle de données</text><text x="400" y="52" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">4 relations</text><text x="400" y="67" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">3 mesures DAX</text><text x="400" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">aucune colonne utilitaire</text><line x1="570" y1="58" x2="584" y2="58" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="582" y="12" width="176" height="100" rx="4" fill="#eef3f8" stroke="#dce6f0" stroke-width="1.3"/><text x="592" y="32" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">TCD + segments</text><text x="592" y="52" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">7 catégories × 5 mesures</text><text x="592" y="67" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">3 segments connectés</text><text x="592" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">4 graphiques liés</text><text x="6" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Le même résultat, deux contrats : la requête garde la recette, le TCD garde la mise en page.</text><rect x="6" y="160" width="768" height="24" rx="3" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="14" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">Excel pour Microsoft 365 · 2021 · 2024 (Windows)</text><text x="300" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">les quatre étapes, complètes</text><rect x="6" y="186" width="768" height="24" rx="3" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="14" y="201" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">Excel 2019 (Perpetual)</text><text x="300" y="201" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">les quatre étapes aussi ; sans les fonctions dynamiques ni Python dans Excel</text><rect x="6" y="212" width="768" height="24" rx="3" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="14" y="227" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">Excel pour Mac</text><text x="300" y="227" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="start">Obtenir des données depuis la version 16.69, mais ni modèle ni Power Pivot</text><rect x="6" y="238" width="768" height="24" rx="3" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="14" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">LibreOffice Calc</text><text x="300" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#8a5a12" text-anchor="start">tableaux croisés en natif, ni segments ni Power Query ni modèle : tout en formules</text><text x="6" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">Python dans Excel : Microsoft 365 seulement (Windows depuis 2024, web depuis 2025).</text><text x="6" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">Le calcul part dans le cloud : hors connexion rien ne se recalcule, et ni 2021 ni 2024 perpétuels ne le proposent.</text></svg>