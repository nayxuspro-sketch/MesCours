<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Décider et répéter : le flux de plusieurs valeurs</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">C02 a donné la grammaire d'une valeur ; C03 donne le flux : carrefour, tapis, porte de sortie.</text><text x="20" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Décider — l'échelle if/elif/else</text><rect x="40" y="100" width="310" height="48" rx="4" fill="#ffffff" stroke="#5b7fa6" stroke-width="1.2"/><text x="54" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">if total &lt; 1 000</text><text x="54" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">→ comptant</text><line x1="350" y1="148" x2="350" y2="156" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="40" y="156" width="310" height="48" rx="4" fill="#ffffff" stroke="#5b7fa6" stroke-width="1.2"/><text x="54" y="176" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">elif total &lt;= 15 000</text><text x="54" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">→ dossier</text><line x1="350" y1="204" x2="350" y2="212" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="40" y="212" width="310" height="48" rx="4" fill="#f4f7fa" stroke="#5b7fa6" stroke-width="1.2"/><text x="54" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">else</text><text x="54" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start">→ financement (le reste)</text><text x="40" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">la 1re condition vraie gagne — le reste est sauté</text><text x="40" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">(le CASE WHEN de M06, ligne par ligne)</text><text x="40" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#b3541e" text-anchor="start" font-weight="600">l'indentation EST la syntaxe : 4 espaces par niveau</text><text x="400" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Répéter — for / while</text><rect x="410" y="100" width="340" height="58" rx="4" fill="#eef2f6" stroke="#8fa3b5" stroke-width="1.2"/><text x="422" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">for : le tapis roulant (5 magasins)</text><rect x="418" y="126" width="60" height="22" rx="3" fill="#ffffff" stroke="#5b7fa6" stroke-width="1"/><text x="448" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#12365a" text-anchor="middle">Ouaga C.</text><rect x="485" y="126" width="60" height="22" rx="3" fill="#ffffff" stroke="#5b7fa6" stroke-width="1"/><text x="515" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#12365a" text-anchor="middle">Patte d'Oie</text><rect x="552" y="126" width="60" height="22" rx="3" fill="#ffffff" stroke="#5b7fa6" stroke-width="1"/><text x="582" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#12365a" text-anchor="middle">Bobo C.</text><rect x="619" y="126" width="60" height="22" rx="3" fill="#ffffff" stroke="#5b7fa6" stroke-width="1"/><text x="649" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#12365a" text-anchor="middle">Bobo S.</text><rect x="686" y="126" width="60" height="22" rx="3" fill="#ffffff" stroke="#5b7fa6" stroke-width="1"/><text x="716" y="141" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#12365a" text-anchor="middle">Koudougou</text><rect x="410" y="170" width="340" height="40" rx="4" fill="#dbe7f3" stroke="#5b7fa6" stroke-width="1.2"/><text x="422" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">while : « tant que credit &gt; 0 » — la fin est votre contrat</text><text x="422" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#b3541e" text-anchor="start">sans break ni décrement : tuée à 2 s dans l'atelier (code 124)</text><rect x="410" y="222" width="165" height="56" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="422" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#b3541e" text-anchor="start" font-weight="600">break</text><text x="422" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">sortir tout de suite</text><text x="422" y="269" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">le rapport dit 7 sur 10</text><rect x="585" y="222" width="165" height="56" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="597" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#b3541e" text-anchor="start" font-weight="600">continue</text><text x="597" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">sauter le tour, repartir</text><text x="597" y="269" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">compter les pourries</text><text x="410" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">for...else : l'else parle si personne n'a cassé</text><text x="410" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">(le « magasin introuvable » sans variable drapeau)</text><rect x="20" y="330" width="740" height="64" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start" font-weight="600">Résumer : [m for m in montants if m &gt; 1000] — le tapis avec filtre, en une ligne</text><text x="36" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">zip(magasins, surfaces) : deux listes en lockstep — le SELECT de 2 colonnes, en Python</text><text x="36" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">Règles : for si on compte · while si on ne compte pas · compréhension = 1 niveau, 1 condition</text></svg>