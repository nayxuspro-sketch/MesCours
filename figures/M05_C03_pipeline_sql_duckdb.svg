<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">SQL DuckDB : 11 tables temporaires, un seul verdict</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le pipeline SQL passe par 11 CTE (Common Table Expressions) nommées v1...v6.</text><rect x="12" y="90" width="64" height="170" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="44" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_brut</text><text x="44" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">Source brute (6</text><text x="44" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">884 + reste)</text><line x1="76" y1="175.0" x2="82" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="82" y="90" width="64" height="170" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="114" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_dates</text><text x="114" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">Dates transposées</text><text x="114" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">(23 → 0)</text><line x1="146" y1="175.0" x2="152" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="152" y="90" width="64" height="170" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="184" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_types</text><text x="184" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">TRY_CAST sur toutes</text><text x="184" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">colonnes</text><line x1="216" y1="175.0" x2="222" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="222" y="90" width="64" height="170" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="254" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_montants</text><text x="254" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">1 200 FCFA → 1200</text><text x="254" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">(114 texte)</text><line x1="286" y1="175.0" x2="292" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="292" y="90" width="64" height="170" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="324" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_remises</text><text x="324" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">&gt; 1 = corrigé (32)</text><text x="324" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle"></text><line x1="356" y1="175.0" x2="362" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="362" y="90" width="64" height="170" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="394" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_retours</text><text x="394" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">filtre 'retour'</text><text x="394" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">(74)</text><line x1="426" y1="175.0" x2="432" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="432" y="90" width="64" height="170" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="464" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_clients</text><text x="464" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">EXCLUDE clients</text><text x="464" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">inconnus</text><line x1="496" y1="175.0" x2="502" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="502" y="90" width="64" height="170" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="534" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_mars</text><text x="534" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">BETWEEN 01-03 et</text><text x="534" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">31-03</text><line x1="566" y1="175.0" x2="572" y2="175.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="572" y="90" width="64" height="170" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="604" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">v_cle</text><text x="604" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#42566b" text-anchor="middle">ROW_NUMBER sur</text><text x="604" y="284" font-family="Inter, Segoe UI, 