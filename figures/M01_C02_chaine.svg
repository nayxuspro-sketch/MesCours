ont-weight="normal" fill="#1c2430" text-anchor="start">décembre = 4,2 × mai</text><text x="392" y="90" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">la Plomberie pèse 24,3 %</text><text x="392" y="104" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">comparaison utile</text><line x1="370" y1="47" x2="384" y2="47" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="574" y="34" width="175" height="26" rx="6" fill="#fbe9e7" stroke="#3c4653" stroke-width="0.9"/><text x="661.5" y="51.5" font-size="12.5" font-weight="bold" fill="#1c2430" text-anchor="middle">DÉCISION</text><text x="580" y="76" font-size="9.5" font-weight="normal" fill="#1c2430" text-anchor="start">avancer les stocks de</text><text x="580" y="90" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">plomberie au 1er déc.</text><text x="580" y="104" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">un acte, un chef</text><line x1="558" y1="47" x2="572" y2="47" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><text x="10" y="126" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="start">Tout le métier est dans les deux flèches du milieu : sans comparaison, rien ne se décide.</text><rect x="10" y="138" width="740" height="40" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="380.0" y="162.5" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="middle"></text><text x="20" y="154" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">Demande reçue   : « le magasin 5 marche bien ? » — ni prouvable, ni réfutable.</text><text x="20" y="167" font-size="11" font-weight="bold" fill="#1c2430" text-anchor="start">Question analytique : « quel mois de 2025 s'écarte le plus de la médiane mensuelle ? »</text><text x="8" y="207" font-size="11" fill="#6a7382">Figure 2 — Les quatre maillons, chiffrés sur le fichier réel de l'atelier (ventes_magasin5_2025.csv)