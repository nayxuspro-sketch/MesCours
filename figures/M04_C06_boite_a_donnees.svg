<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="6" y="22" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Livrer une boîte à données — trois zones, un journal, un contrôle qui attend</text><text x="6" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">La documentation n'est pas la récompense du travail : c'est la condition de son rejeu.</text><rect x="6" y="54" width="768" height="34" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">brut/</text><text x="120" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">10 fichiers</text><text x="260" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">l'arrivée, telle qu reçue</text><text x="700" y="75" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="end">lecture seule — jamais réécrite</text><rect x="6" y="94" width="768" height="34" rx="4" fill="#f2f7f2" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">reference/</text><text x="120" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">12 fichiers</text><text x="260" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">la vérité : propres, dictionnaires, verites_terrain</text><text x="700" y="115" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="end">écrit par décision, jamais à la volée</text><rect x="6" y="134" width="768" height="34" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="155" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">projection/</text><text x="120" y="155" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2 fichiers</text><text x="260" y="155" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">les échantillons distribués aux modules</text><text x="700" y="155" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="end">dérivé : recréable, avec son ATTENDU</text><rect x="6" y="174" width="380" height="110" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="192" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Le journal se referme par un compteur</text><text x="16" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ventes : 243 360 → 240 000 (3 360, règle du C03)</text><text x="16" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">montants texte : 3 421 → 0 (convergence à 0 franc)</text><text x="16" y="242" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">clients : 23 912 → 23 500 (412, clé nom + chiffres)</text><text x="16" y="258" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">catégories : 16 modalités dont 1 vide → 7</text><text x="16" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">avant - après = retirés : sinon, c'est une note, pas une ligne</text><rect x="394" y="174" width="380" height="110" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="404" y="192" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Le contrôle final attend des résidus, pas des zéros</text><text x="404" y="210" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">12 points : 0 vides, 0 texte, 0 domaine, 0 actualité</text><text x="404" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">unicité métier : 80 groupes (160 lignes) — attendus</text><text x="404" y="242" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">distincts par l'heure 80/80, client 77, prix 72 ; indistincts : 0</text><text x="404" y="258" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">total : 15 419 985 157 FCFA = verites_terrain, écart 0</text><text x="404" y="274" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">le résidu attendu s'écrit avant le contrôle</text><rect x="6" y="296" width="768" height="54" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Protéger, c'est chiffrer : 4 fichiers de personnes, un risque mesuré</text><text x="16" y="332" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">nom 23 912 · téléphone 23 912 · e-mail 7 398 · ville 22 001 · 22 vendeurs · 6 responsables · 3 rôles</text><text x="16" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">sans nom/tél/e-mail, 87,3 % des clients restent désignés par 4 colonnes anonymes ; l'e-mail encode l'id dans 7 265 cas</text></svg>