1"/><text x="16" y="396" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Le prix des deux traitements de la colonne D, mesuré sur le même fichier :</text><text x="16" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">dériver par la règle · 15 639 751 286 FCFA   |   imputer à la moyenne · 15 642 826 075 FCFA</text><text x="16" y="428" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">cible vérifiée : 15 419 985 157 FCFA. L’écart restant n’est pas une histoire d’absence : ce sont les lignes en trop (C03).</text></svg>