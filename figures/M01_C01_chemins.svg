<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" font-family="DejaVu Sans"><rect width="760" height="280" fill="#ffffff"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4653"/></marker></defs><text x="10" y="20" font-size="13.5" font-weight="bold" fill="#1c2430" text-anchor="start">Un chemin = un lecteur + des dossiers + un nom + une extension</text><rect x="10" y="34" width="30.1" height="24" fill="#fdf3dd" stroke="#3c4653" stroke-width="0.7"/><text x="25.05" y="50" font-size="11.5" font-weight="normal" fill="#1c2430" text-anchor="middle">C:/</text><text x="62" y="72" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="middle">lecteur</text><rect x="40.1" y="34" width="217.70000000000002" height="24" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.7"/><text x="148.95000000000002" y="50" font-size="11.5" font-weight="normal" fill="#1c2430" text-anchor="middle">Users/a.minani/Documents/Sahel/</text><text x="62" y="72" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">dossiers</text><rect x="257.8" y="34" width="83.7" height="24" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.7"/><text x="299.65000000000003" y="50" font-size="11.5" font-weight="normal" fill="#1c2430" text-anchor="middle">01_Extract/</text><text x="259.8" y="72" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">sous-dossier</text><rect x="341.5" y="34" width="144.0" height="24" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.7"/><text x="413.5" y="50" font-size="11.5" font-weight="normal" fill="#1c2430" text-anchor="middle">ventes_magasin5_2025</text><text x="343.5" y="72" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="start">nom</text><rect x="485.5" y="34" width="36.8" height="24" fill="#fbe9e7" stroke="#3c4653" stroke-width="0.7"/><text x="503.9" y="50" font-size="11.5" font-weight="normal" fill="#1c2430" text-anchor="middle">.csv</text><text x="487.5" y="72" font-size="9.5" font-weight="normal" fill="#41505f" text-anchor="middle">extension</text><text x="10" y="88" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">Séparateur : « / » sous Linux, macOS et dans Python ; « \ » sous Windows.</text><text x="10" y="101" font-size="10.5" font-weight="normal" fill="#41505f" text-anchor="start">Excel et Python acceptent les deux ; l'Explorateur Windows n'en accepte qu'un.</text><rect x="10" y="114" width="240" height="28" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="130.0" y="132.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">ventes_magasin5_2025.csv</text><text x="262" y="126" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">le fichier des ventes du magasin 5, année 2025</text><text x="262" y="139" font-size="10" font-weight="normal" fill="#41505f" text-anchor="start">nom écrit par vous, date explicite</text><rect x="10" y="150" width="240" height="28" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="130.0" y="168.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">ventes_magasin5_2025_v2.xlsx</text><text x="262" y="162" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">la version 2, retravaillée dans Excel</text><text x="262" y="175" font-size="10" font-weight="normal" fill="#8a5b06" text-anchor="start">piège : « v2 » ne dit ni qui ni quand</text><rect x="10" y="186" width="240" height="28" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="130.0" y="204.5" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="middle">rapport_final(1).pdf</text><text x="262" y="198" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">le même rapport téléchargé deux fois</text><text x="262" y="211" font-size="10" font-weight="normal" fill="#8a5b06" text-anchor="start">piège : nom fabriqué par le navigateur</text><text x="10" y="228" font-size="11.5" font-weight="bold" fill="#1c2430" text-anchor="start">Convention du manuel : AAAA-MM-JJ_quoi_qui.ext, sans espace ni accent.</text><text x="10" y="244" font-size="11" font-weight="normal" fill="#1a7f4b" text-anchor="start">exemple : 2026-09-17_ventes_M5_minani.csv</text><text x="8" y="271" font-size="11" fill="#6a7382">Figure 1 — Décortiquer un chemin, et les trois noms de fichiers qui posent problème dès la première semaine.</text></svg>