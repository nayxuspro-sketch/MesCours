<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Décomposer une série : le lit (tendance), les crues (saison), les vagues (bruit)</text><text x="20" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">La bâche (moyenne glissante) pour le lit ; l'amplitude entre positions vs intra-position pour la saison.</text><rect x="20" y="60" width="440" height="300" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">Série mensuelle du centre (extrait chiffré)</text><line x1="60" y1="320" x2="60" y2="100" stroke="#8895a5" stroke-width="1.4" marker-end="url(#f)"/><line x1="60" y1="320" x2="430" y2="320" stroke="#8895a5" stroke-width="1.4" marker-end="url(#f)"/><text x="52" y="336" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">mois</text><path d="M80,258 L110,240 L140,250 L170,214 L200,150 L230,118 L260,132 L290,140 L320,246 L350,262 L380,254 L410,236" fill="none" stroke="#c96a1a" stroke-width="1.6"/><circle cx="80" cy="258" r="2.6" fill="#c96a1a"/><circle cx="110" cy="240" r="2.6" fill="#c96a1a"/><circle cx="140" cy="250" r="2.6" fill="#c96a1a"/><circle cx="170" cy="214" r="2.6" fill="#c96a1a"/><circle cx="200" cy="150" r="2.6" fill="#c96a1a"/><circle cx="230" cy="118" r="2.6" fill="#c96a1a"/><circle cx="260" cy="132" r="2.6" fill="#c96a1a"/><circle cx="290" cy="140" r="2.6" fill="#c96a1a"/><circle cx="320" cy="246" r="2.6" fill="#c96a1a"/><circle cx="350" cy="262" r="2.6" fill="#c96a1a"/><circle cx="380" cy="254" r="2.6" fill="#c96a1a"/><circle cx="410" cy="236" r="2.6" fill="#c96a1a"/><path d="M80,238 L410,232" fill="none" stroke="#1f4e79" stroke-width="2.6"/><rect x="168" y="100" width="130" height="190" rx="2" fill="#f3e8d8" stroke="#d9b38c" stroke-width="1" stroke-dasharray="5 4"/><text x="176" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a4a12" text-anchor="start" font-weight="600">été : 853/mois (834-882)</text><text x="322" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a4a12" text-anchor="start" font-weight="600">hiver : 655/mois</text><text x="232" y="112" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#c96a1a" text-anchor="start" font-weight="600">pic 2025-07 : 882</text><text x="352" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="start" font-weight="600">bâche mg3 : le lit</text><text x="84" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#42566b" text-anchor="start">déc-2025</text><text x="392" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#42566b" text-anchor="start">2026</text><line x1="36" y1="342" x2="56" y2="342" stroke="#c96a1a" stroke-width="1.6"/><text x="62" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">série (vagues)</text><line x1="150" y1="342" x2="170" y2="342" stroke="#1f4e79" stroke-width="2.6"/><text x="176" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">bâche (lit)</text><rect x="250" y="336" width="20" height="12" rx="2" fill="#f3e8d8" stroke="#d9b38c" stroke-width="1" stroke-dasharray="5 4"/><text x="276" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">crue (saison)</text><rect x="478" y="60" width="282" height="300" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="494" y="84" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">La règle du chapitre</text><text x="494" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Un cycle est STRUCTUREL quand</text><text x="494" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">l'écart ENTRE positions domine</text><text x="494" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">la variabilité DANS chaque position :</text><rect x="494" y="162" width="250" height="40" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="506" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">été vs hiver : environ 198</text><text x="506" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">variabilité intra-été : environ 48</text><text x="494" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">198 &gt;&gt; 48 (x4) : la saison est</text><text x="494" y="242" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">structurelle, pas du bruit.</text><text x="494" y="270" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Fil rouge (quincaillerie) : la</text><text x="494" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">bâche n'est qu'à 17 M d'amplitude</text><text x="494" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">vs 10.8 M d'écart-type : PLAT,</text><text x="494" y="324" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">+1.6 % à mois égal — déclaré.</text><text x="494" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">Le zéro-fait : rupture M01 (3 j)</text><text x="494" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">au pic de juillet — tendance</text><text x="494" y="382" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start" font-weight="600">interrompue, pas retombée.</text><rect x="20" y="380" width="440" height="126" rx="4" fill="#fff0f0" stroke="#d98c8c" stroke-width="1.4"/><text x="36" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#7a2020" text-anchor="start" font-weight="600">Le mois partiel ment (décembre 2026 : 28 jours)</text><text x="36" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a2020" text-anchor="start">total : 307 M &lt; 315 M (2025) — « baisse » ?</text><text x="36" y="444" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a2020" text-anchor="start" font-weight="600">flux par jour : 11.0 M vs 10.2 M — en réalité +8 %.</text><text x="36" y="466" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">Règles : comparer à MOIS ÉGAL, ou au flux</text><text x="36" y="482" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">par jour — ou DÉCLARER « aucune conclusion »</text><text x="36" y="498" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start" font-weight="600">(l'étape se déclare, elle ne se saute pas).</text></svg>