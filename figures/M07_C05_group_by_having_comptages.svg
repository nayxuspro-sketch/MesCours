<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">GROUP BY : une ligne de synthese par groupe</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Les tiroirs : chaque ligne va dans le groupe de sa cle ; l'agregat se recalcule par tiroir.</text><rect x="20" y="66" width="300" height="54" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">50 008 ventes</text><text x="36" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">montant_ttc, id_magasin, id_mode …</text><line x1="330" y1="93" x2="390" y2="93" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="400" y="66" width="180" height="54" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1"/><text x="416" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">GROUP BY</text><text x="416" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">id_magasin (la cle)</text><line x1="590" y1="93" x2="650" y2="93" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="660" y="66" width="100" height="54" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1"/><text x="676" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">5 lignes</text><text x="676" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1 par groupe</text><rect x="20" y="138" width="400" height="130" rx="4" fill="#ffffff" stroke="#9db3c8" stroke-width="1"/><text x="36" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">id_magasin</text><text x="150" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">nb_ventes</text><text x="270" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">ca (FCFA)</text><text x="36" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4</text><text x="150" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">10 061</text><text x="270" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 596 813 264</text><text x="36" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1</text><text x="150" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">10 099</text><text x="270" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 595 223 423</text><text x="36" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2</text><text x="150" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">10 033</text><text x="270" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 578 987 708</text><text x="36" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5</text><text x="150" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">9 942</text><text x="270" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 572 297 452</text><text x="36" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3</text><text x="150" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">9 873</text><text x="270" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1 564 937 883</text><rect x="20" y="268" width="400" height="22" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="284" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start" font-weight="600">somme des ca = 7 908 259 731 (controle C04)</text><rect x="440" y="138" width="320" height="152" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1"/><text x="456" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">HAVING : filtre sur les GROUPES</text><text x="456" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">HAVING COUNT(*) &gt; 9900</text><text x="456" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">-&gt; 4 groupes : le magasin 3 (9 873) sort</text><text x="456" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Le seuil est une decision métier : le documenter.</text><text x="456" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Agreger puis filtrer : HAVING voit les totaux.</text><text x="456" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">WHERE voit les lignes, HAVING voit les groupes.</text><rect x="20" y="306" width="740" height="76" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="328" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Pieges du GROUP BY</text><text x="36" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Regrouper par un libelle double (rayon) : 8 categories fondent en 5 groupes, sans erreur.</text><text x="36" y="370" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Un agrégat dans WHERE : interdit ("WHERE clause cannot contain aggregates") -&gt; HAVING.</text><text x="36" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Oublier le ELSE 0 dans SUM(CASE WHEN …) : les NULL ne s'additionnent pas.</text></svg>