   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b1b1b" x="28.404" y="235.190719" transform="rotate(-0 28.404 235.190719)">Ce que le fil rouge demande, en regard</text>
   </g>
   <g id="text_30">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="28.404" y="243.931659" transform="rotate(-0 28.404 243.931659)">240 000 lignes de ventes · modele de 1 Go en Pro, 100 Go en Premium Per User</text>
   </g>
   <g id="text_31">
    <text style="font-size: 7.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="28.404" y="253.910859" transform="rotate(-0 28.404 253.910859)">8 puis 48 actualisations par jour · une journee de ventes se recharge la nuit</text>
   </g>
   <g id="text_32">
