   </g>
   <g id="text_28">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(19.9224 213.918075)">Le seuil F64 est le seul point de rupture : en dessous, chaque lecteur a besoin d'une licence ; a partir de la,</text>
