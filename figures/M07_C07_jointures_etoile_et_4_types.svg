<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Joindre : la jointure en etoile et les 4 types</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">La table centrale (vente) est reliee aux tables de reference par leurs cles.</text><rect x="310" y="90" width="160" height="56" rx="4" fill="#fff8e1" stroke="#7a3b12" stroke-width="1.5"/><text x="330" y="112" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a3b12" text-anchor="start" font-weight="600">vente</text><text x="330" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">50 008 lignes (centrale)</text><rect x="40" y="70" width="180" height="40" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="52" y="87" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">client</text><text x="52" y="103" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">1 200 lignes</text><text x="100" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">ON v.id_client = c.id_client</text><rect x="560" y="70" width="180" height="40" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="572" y="87" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">produit</text><text x="572" y="103" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">380 lignes</text><text x="620" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">ON v.id_produit = p.id_produit</text><rect x="40" y="165" width="180" height="40" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="52" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">magasin</text><text x="52" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">5 lignes</text><text x="100" y="217" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">ON v.id_magasin = m.id_magasin</text><rect x="560" y="165" width="180" height="40" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="572" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">mode_paiement</text><text x="572" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">5 lignes</text><text x="620" y="217" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">ON v.id_mode = mp.id_mode</text><text x="240" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">4 relations N -&gt; 1 : le resultat garde 50 008 lignes (enrichi, pas double).</text><rect x="20" y="262" width="182" height="66" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="32" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">INNER</text><text x="32" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">les paires des deux cotes</text><text x="32" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">50 008</text><rect x="208" y="262" width="182" height="66" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="220" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">LEFT</text><text x="220" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">tout le gauche, NULL a droite</text><text x="220" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">5 (objectifs vides)</text><rect x="396" y="262" width="182" height="66" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="408" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">FULL</text><text x="408" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">les deux cotes</text><text x="408" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">absent de SQLite</text><rect x="584" y="262" width="182" height="66" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="596" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">CROSS</text><text x="596" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">produit cartésien 5 x 5</text><text x="596" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">25</text><rect x="20" y="344" width="740" height="52" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Piege P4 : jointure qui double</text><text x="36" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">vente JOIN vente ON id_client : 50 008 -&gt; 2 131 064 lignes (facteur ~42). Controle : COUNT(*) avant/apres.</text></svg>