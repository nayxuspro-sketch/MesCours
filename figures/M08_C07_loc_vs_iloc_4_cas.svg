t_ttc) · colonne bleue = id_magasin</text><text x="477" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="middle" font-weight="600">par NOM (loc)</text><text x="662" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="middle" font-weight="600">par POSITION (iloc)</text><text x="570" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="middle" font-weight="600">— une LIGNE —</text><text x="570" y="205" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="middle" font-weight="600">— une COLONNE —</text><rect x="390" y="110" width="175" height="88" rx="6" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="402" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">ligne · par nom</text><text x="402" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1f4e79" text-anchor="start">v4.loc[1, 'montant_ttc']</text><text x="402" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">→ 359109.80</text><rect x="575" y="110" width="175" height="88" rx="6" fill="#eef2f6" stroke="#5b7fa6" stroke-width="1.2"/><text x="587" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">ligne · par position</text><text x="587" y="154" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1f4e79" text-anchor="start">v4.iloc[1, 2]</text><text x="587" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">→ 359109.80</text><rect x="390" y="215" width="175" height="88" rx="6" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="402" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">colonne · par nom</text><text x="402" y="259" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1f4e79" text-anchor="start">v4.loc[:, 'id_magasin']</text><text x="402" y="283" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">→ [2, 1, 2, 3, 4]</text><rect x="575" y="215" width="175" height="88" rx="6" fill="#eef2f6" stroke="#5b7fa6" stroke-width="1.2"/><text x="587" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">colonne · par position</text><text x="587" y="259" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1f4e79" text-anchor="start">v4.iloc[:, 1]</text><text x="587" y="283" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">→ [2, 1, 2, 3, 4]</text><text x="477" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="middle">les 4 portes donnent la même valeur :</text><text x="477" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#42566b" text-anchor="middle">la cellule orange (359109.80) ou la colonne bleue — toujours la même pièce</text><rect x="20" y="372" width="740" height="72" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="394" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">Le piège des tranches : v4.loc[1:3] → 3 lignes · v4.iloc[1:3] → 2 lignes</text><text x="36" y="414" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">la borne haute est INCLUE par nom (loc), EXCLUE par position (iloc) —</text><text x="36" y="430" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">même écriture, une ligne de moins : le contrôle len() est la garde-fou.</text></svg>