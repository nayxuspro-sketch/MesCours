<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Trois relations — 1-1, 1-N, N-M, et la table de jointure</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">La FK est TOUJOURS du N vers le 1. La N-M exige une table de jointure a cle composee.</text><rect x="20" y="80" width="240" height="32" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="32" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">1-1 (rare)</text><text x="32" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">client &lt;-&gt; client_profil</text><rect x="40" y="150" width="80" height="36" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="80" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">client</text><rect x="160" y="150" width="80" height="36" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="200" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">profil</text><text x="80" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="middle">id_client PK</text><line x1="120" y1="168" x2="160" y2="168" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><text x="140" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="middle" font-weight="600">1</text><rect x="276" y="80" width="240" height="32" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="288" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">1-N (la plus courante)</text><text x="288" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">client (1) -&gt; vente (N)</text><rect x="296" y="150" width="70" height="36" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="331" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">client</text><rect x="416" y="150" width="70" height="36" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="451" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">vente</text><line x1="366" y1="168" x2="416" y2="168" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><text x="391" y="165" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a02020" text-anchor="middle" font-weight="600">N</text><text x="331" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="middle">id_client PK</text><text x="451" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="middle">id_client FK</text><rect x="532" y="80" width="240" height="32" rx="4" fill="#fdf7f4" stroke="#1f4e79" stroke-width="1"/><text x="544" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">N-M (la subtile)</text><text x="544" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">client (N) &lt;-&gt; categorie (M)</text><rect x="542" y="150" width="60" height="36" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="572" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="middle" font-weight="600">client</text><rect x="622" y="150" width="60" height="36" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="652" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="middle" font-weight="600">ccp</text><text x="652" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#7a3b12" text-anchor="middle">PK=(id_client,categorie)</text><rect x="702" y="150" width="60" height="36" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="732" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="middle" font-weight="600">categorie</text><line x1="602" y1="168" x2="622" y2="168" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><line x1="682" y1="168" x2="702" y2="168" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><text x="612" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a02020" text-anchor="middle" font-weight="600">N</text><text x="692" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a02020" text-anchor="middle" font-weight="600">M</text><rect x="20" y="350" width="740" height="100" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Regle d'or : la FK est TOUJOURS du N vers le 1.</text><text x="36" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Direction : vente FK client, pas l'inverse (sinon cycle).</text><text x="36" y="408" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Action par defaut : ON DELETE RESTRICT (refuse). CASCADE documente.</text><text x="36" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Integrite referentielle : SELECT ... FROM v LEFT JOIN c ... WHERE c.id IS NULL -&gt; 0.</text><text x="36" y="440" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Reparation : exclure, creer la cible, ou mettre la FK a NULL (toujours documenter).</text></svg>