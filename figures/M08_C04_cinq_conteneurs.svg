<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Ranger : 5 conteneurs, 5 questions métier</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Choisir le contenant, c'est choisir la réponse — l'autre, c'est du débogage.</text><rect x="20" y="90" width="220" height="118" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><rect x="20" y="90" width="220" height="30" rx="4" fill="#1f4e79" stroke="#1f4e79" stroke-width="0"/><text x="32" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">liste</text><text x="32" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">« le n-ieme ? » — l'ordre</text><text x="32" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start">l[i] · l[1:3] · append</text><text x="32" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">la ligne n a l'index n-1</text><text x="32" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">IndexError sinon</text><rect x="260" y="90" width="220" height="118" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><rect x="260" y="90" width="220" height="30" rx="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="0"/><text x="272" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">tuple</text><text x="272" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">« le fait figé » — la clé</text><text x="272" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start">n, p = t · clé de dict</text><text x="272" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">immuable : scellé</text><text x="272" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">TypeError si on répare</text><rect x="500" y="90" width="220" height="118" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><rect x="500" y="90" width="220" height="30" rx="4" fill="#7a3b12" stroke="#7a3b12" stroke-width="0"/><text x="512" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">str</text><text x="512" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">« le texte propre »</text><text x="512" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start">strip · split · replace</text><text x="512" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">format français : replace puis float</text><text x="512" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">f"{158140:,.0f}"</text><rect x="20" y="225" width="220" height="118" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><rect x="20" y="225" width="220" height="30" rx="4" fill="#5b7fa6" stroke="#5b7fa6" stroke-width="0"/><text x="32" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">dict</text><text x="32" y="277" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">« le comptage par… »</text><text x="32" y="297" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start">d.get(k, 0) + 1</text><text x="32" y="317" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">= le GROUP BY de M06</text><text x="32" y="333" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">KeyError sans .get</text><rect x="260" y="225" width="220" height="118" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><rect x="260" y="225" width="220" height="30" rx="4" fill="#b3541e" stroke="#b3541e" stroke-width="0"/><text x="272" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">set</text><text x="272" y="277" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">« combien de distincts ? »</text><text x="272" y="297" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start">len(set(x)) · c1 &amp; c2</text><text x="272" y="317" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">= COUNT(DISTINCT) · JOIN interne</text><text x="272" y="333" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">le tamis : doublons sortis</text><rect x="500" y="225" width="220" height="118" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><rect x="500" y="225" width="220" height="30" rx="4" fill="#12365a" stroke="#12365a" stroke-width="0"/><text x="512" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600">tri</text><text x="512" y="277" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">« le top N »</text><text x="512" y="297" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start">sorted(items, key=…)[:n]</text><text x="512" y="317" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">= ORDER BY … LIMIT n</text><text x="512" y="333" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#7a3b12" text-anchor="start">sorted renvoie · sort modifie</text><rect x="20" y="368" width="740" height="44" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="388" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start" font-weight="600">C07 : le DataFrame reprend tout — une colonne = une liste indexée (loc/iloc),</text><text x="36" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">une table = un dictionnaire de colonnes — les 50 008 lignes du socle attendent.</text></svg>