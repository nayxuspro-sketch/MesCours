" font-weight="600">55</text><text x="18" y="174" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4</text><rect x="46" y="164" width="150" height="14" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="46" y="164" width="3" height="14" rx="2" fill="#a1650b" stroke="#a1650b" stroke-width="1"/><text x="240" y="174" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="end" font-weight="600">6</text><rect x="14" y="200" width="234" height="36" rx="4" fill="#fff8f0" stroke="#e0a800" stroke-width="1"/><text x="22" y="215" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a1650b" text-anchor="start">=NB.SI(TableVentes[date];1)</text><text x="22" y="229" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a33636" text-anchor="start">rend 0 : le 1er est une date, pas le nombre 1</text><rect x="266" y="6" width="250" height="240" rx="4" fill="#fbfdff" stroke="#9fb0c0" stroke-width="1"/><text x="278" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">Jours de la semaine</text><text x="278" y="42" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">=JOURSEM(date;2) : lundi = 1</text><text x="278" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">lun</text><rect x="306" y="60" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="60" width="160" height="12" rx="2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="504" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">103</text><text x="278" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">mar</text><rect x="306" y="82" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="82" width="118" height="12" rx="2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="504" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">76</text><text x="278" y="114" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">mer</text><rect x="306" y="104" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="104" width="127" height="12" rx="2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="504" y="114" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">82</text><text x="278" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">jeu</text><rect x="306" y="126" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="126" width="94" height="12" rx="2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="504" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">61</text><text x="278" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ven</text><rect x="306" y="148" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="148" width="54" height="12" rx="2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="504" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="end" font-weight="600">35</text><text x="278" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">sam</text><rect x="306" y="170" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="170" width="141" height="12" rx="2" fill="#a33636" stroke="#a33636" stroke-width="1"/><text x="504" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a33636" text-anchor="end" font-weight="600">91</text><text x="278" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">dim</text><rect x="306" y="192" width="160" height="12" rx="4" fill="#eef3f8" stroke="#dbe4ec" stroke-width="1"/><rect x="306" y="192" width="49" height="12" rx="2" fill="#a33636" stroke="#a33636" stroke-width="1"/><text x="504" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a33636" text-anchor="end" font-weight="600">32</text><text x="278" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start" font-weight="600">123 lignes le samedi ou le dimanche :</text><text x="278" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start">25,6 % de l’extrait</text><rect x="526" y="6" width="226" height="240" rx="4" fill="#f2f8f2" stroke="#9dbf9d" stroke-width="1"/><text x="538" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#3f7d3f" text-anchor="start" font-weight="600">Un total, deux rythmes</text><text x="538" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">CA de l’extrait</text><text x="538" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">36 073 185 FCFA</text><text x="538" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">=NB.JOURS.OUVRES(min ; max)</text><text x="538" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">240 jours ouvrés</text><text x="538" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">150 305 FCFA par jour ouvré</text><text x="538" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">=max-min+1  (jours courus)</text><text x="538" y="166" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start" font-weight="600">336 jours calendaires</text><text x="538" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start" font-weight="600">107 361 FCFA par jour couru</text><rect x="534" y="198" width="210" height="40" rx="4" fill="#ffffff" stroke="#cfe0cf" stroke-width="1"/><text x="540" y="213" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start" font-weight="600">Les deux sont justes ;</text><text x="540" y="227" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">aucun n’est une moyenne de vente.</text><rect x="6" y="254" width="746" height="190" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="276" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">La fiche double : la voie moderne, et la voie que tout le classeur peut lire</text><rect x="14" y="281" width="730" height="42" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">Les lignes de décembre</text><text x="22" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="start">moderne  =FILTRE(TableVentes!A2:M481;MOIS(TableVentes!B2:B481)=12)</text><text x="22" y="322" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">accessible  =SOMME.SI.ENS([montant_ttc];[date];"&gt;="&amp;DATE(2025;12;1);[date];"&lt;"&amp;DATE(2026;1;1)) puis un filtre sur la date</text><rect x="14" y="327" width="730" height="42" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="340" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">Le chiffre d'affaires mois par mois</text><text x="22" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="start">moderne  =TRIERPAR(SEQUENCE(12);1;1;1) en ancre de la grille mensuelle</text><text x="22" y="368" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">accessible  la feuille Mensuel de l'atelier : douze fois =SOMME.SI.ENS avec DATE(2025;n;1) pour borne, et FIN.MOIS pour la seconde</text><rect x="14" y="373" width="730" height="42" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">Les catégories réellement présentes</text><text x="22" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1f4e79" text-anchor="start">moderne  =UNIQUE(TableVentes[categorie])</text><text x="22" y="414" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">accessible  =JOINDRE.TEXTE(…;VRAI;…) de la fiche 23, ou une colonne triée puis dédupliquée</text><text x="22" y="440" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a33636" text-anchor="start" font-weight="600">FILTRE · UNIQUE · TRIERPAR · SEQUENCE · LET : Microsoft 365, Excel 2021 et 2024 (en 2019 : #NOM?).</text><text x="22" y="454" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a1650b" text-anchor="start">LibreOffice 24.8+ connaît ces fonctions mais ne renverse pas : pré-allouer la plage, Ctrl + Maj + Entrée.</text></svg>