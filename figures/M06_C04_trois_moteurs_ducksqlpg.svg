<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Trois moteurs — DuckDB integre, SQLite embarque, PostgreSQL serveur</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le bon moteur depend du nombre d'utilisateurs, de la volumetrie et de la gouvernance (cf. C05 §5.6).</text><rect x="20" y="80" width="240" height="32" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="32" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">DuckDB (integre)</text><text x="32" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">in-process, mono-utilisateur, gratuit</text><rect x="36" y="140" width="208" height="220" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="48" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Install :</text><text x="48" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  pip install duckdb</text><text x="48" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  --no-cache-dir</text><text x="48" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Ouverture :</text><text x="48" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  con = duckdb.</text><text x="48" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">    connect(':memory:')</text><text x="48" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Sauvegarde :</text><text x="48" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  EXPORT DATABASE</text><text x="48" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  'backup_dir'</text><text x="48" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Verdict :</text><text x="48" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  1 analyste solo,</text><text x="48" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  jusqu'a 50M l.</text><rect x="276" y="80" width="240" height="32" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="288" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">SQLite (embarque)</text><text x="288" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">fichier .sqlite, mono-utilisateur, natif</text><rect x="292" y="140" width="208" height="220" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="304" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Install :</text><text x="304" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  import sqlite3</text><text x="304" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  (natif Python)</text><text x="304" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Ouverture :</text><text x="304" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  con = sqlite3.</text><text x="304" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">    connect('b.sqlite')</text><text x="304" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a02020" text-anchor="start" font-weight="600">ATTENTION :</text><text x="304" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  PRAGMA foreign_keys</text><text x="304" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  = ON</text><text x="304" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Verdict :</text><text x="304" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  embarque (Android,</text><text x="304" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  iOS, Firefox, ...)</text><rect x="532" y="80" width="240" height="32" rx="4" fill="#fdf7f4" stroke="#1f4e79" stroke-width="1"/><text x="544" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">PostgreSQL (serveur)</text><text x="544" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">client-serveur, multi-utilisateurs</text><rect x="548" y="140" width="208" height="220" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="560" y="160" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Install :</text><text x="560" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  serveur dedie</text><text x="560" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  (~ 150 Mo)</text><text x="560" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Connexion :</text><text x="560" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  psql -h host</text><text x="560" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">    -U user</text><text x="560" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Sauvegarde :</text><text x="560" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  pg_dump mydb</text><text x="560" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  &gt; backup.sql</text><text x="560" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">Verdict :</text><text x="560" y="348" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  multi-utilisateurs,</text><text x="560" y="356" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  production</text><rect x="20" y="380" width="740" height="70" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Verdict M06 : DuckDB en premiere intention (analyste solo),</text><text x="36" y="420" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">SQLite pour embarquer (Android, iOS), PostgreSQL pour partager (production).</text><text x="36" y="438" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">L'atelier n'execute PAS PostgreSQL (regle 7 du plan M05 reconduite : on cite, on installe pas).</text></svg>