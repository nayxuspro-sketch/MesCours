<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Cinq limites du classeur Excel — pourquoi une base de données ?</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le classeur s'effondre a la 3e table jointe et a la 50000e ligne. Cinq limites, une solution : le SGBD.</text><rect x="20" y="80" width="740" height="42" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="97" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">1. Redondance</text><text x="36" y="113" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">la ville_client est recopiée 13 × par client</text><rect x="20" y="130" width="740" height="42" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="147" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">2. Anomalie</text><text x="36" y="163" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">TVA 18 % → 19 % : 24 000 lignes à modifier</text><rect x="20" y="180" width="740" height="42" rx="4" fill="#fdf7f4" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="197" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">3. Multi-valué</text><text x="36" y="213" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">categorie_pref ne porte qu'une seule catégorie</text><rect x="20" y="230" width="740" height="42" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="247" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">4. Concurrence</text><text x="36" y="263" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">deux caissières ouvrent le même classeur en double</text><rect x="20" y="280" width="740" height="42" rx="4" fill="#fbe9e7" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="297" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">5. Volumétrie</text><text x="36" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">240 000 lignes : Excel met 30 s à ouvrir</text><rect x="20" y="350" width="740" height="80" rx="4" fill="#f2f7f2" stroke="#3f7d3f" stroke-width="1"/><text x="36" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#3f7d3f" text-anchor="start" font-weight="600">La solution — un SGBD (DuckDB / SQLite / PostgreSQL)</text><text x="36" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Contraintes portees par la base : PRIMARY KEY, FOREIGN KEY, NOT NULL, CHECK.</text><text x="36" y="408" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Verifier l'integrite par 3 requetes : Q1 referentielle, Q2 montants, Q3 rejouable.</text><text x="36" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3 criteres de bascule : taille &gt; 100k lignes, joints &gt;= 3, concurrence &gt;= 2.</text></svg>