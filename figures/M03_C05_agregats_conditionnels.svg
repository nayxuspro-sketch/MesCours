<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><rect x="6" y="6" width="470" height="236" rx="4" fill="#fbfdff" stroke="#9fb0c0" stroke-width="1"/><text x="18" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">TableVentes[montant_ttc] : 480 lignes, 7 catégories</text><text x="18" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">La formule ne vaut que par la question qu’elle pose</text><rect x="14" y="55" width="454" height="21" rx="4" fill="#f4f8fb" stroke="#f4f8fb" stroke-width="1"/><text x="20" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=SOMME(TableVentes[montant_ttc])</text><text x="462" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="600">36 073 185 FCFA</text><text x="20" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=SOMME.SI.ENS(…;[categorie];"Plomberie")</text><text x="462" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="end" font-weight="600">8 754 982 FCFA</text><rect x="14" y="99" width="454" height="21" rx="4" fill="#f4f8fb" stroke="#f4f8fb" stroke-width="1"/><text x="20" y="112" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=NB.SI.ENS([remise];"&gt;0")</text><text x="462" y="112" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="end" font-weight="600">173 lignes sur 480</text><text x="20" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=MOYENNE(TableVentes[remise])</text><text x="462" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="end" font-weight="600">1,8 %</text><rect x="14" y="143" width="454" height="21" rx="4" fill="#f4f8fb" stroke="#f4f8fb" stroke-width="1"/><text x="20" y="156" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=MOYENNE.SI.ENS([remise];[remise];"&gt;0")</text><text x="462" y="156" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="end" font-weight="600">5,1 %</text><text x="20" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=MEDIANE(TableVentes[montant_ttc])</text><text x="462" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="600">37 966 FCFA</text><rect x="14" y="187" width="454" height="21" rx="4" fill="#f4f8fb" stroke="#f4f8fb" stroke-width="1"/><text x="20" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=MOYENNE(TableVentes[montant_ttc])</text><text x="462" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="600">75 152 FCFA</text><text x="18" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start">75 152 de moyenne contre 37 966 de médiane : la queue, pas une erreur.</text><rect x="490" y="6" width="262" height="236" rx="4" fill="#fff8f0" stroke="#e0a800" stroke-width="1"/><text x="500" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">Compter : quatre réponses</text><text x="500" y="42" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">colonne « client », 480 lignes</text><text x="500" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">NBVAL — non vides</text><rect x="500" y="67" width="200" height="13" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="67" width="192" height="13" rx="2" fill="#3f7d3f" stroke="#3f7d3f" stroke-width="1"/><text x="748" y="77" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#3f7d3f" text-anchor="end" font-weight="600">462</text><text x="500" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">NB — nombres</text><rect x="500" y="107" width="200" height="13" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="107" width="192" height="13" rx="2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="748" y="117" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="end" font-weight="600">462</text><text x="500" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">« 0 » à l’écran</text><rect x="500" y="147" width="200" height="13" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="147" width="35" height="13" rx="2" fill="#a1650b" stroke="#a1650b" stroke-width="1"/><text x="748" y="157" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="end" font-weight="600">85</text><text x="500" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">vraiment vides</text><rect x="500" y="187" width="200" height="13" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="187" width="7" height="13" rx="2" fill="#a33636" stroke="#a33636" stroke-width="1"/><text x="748" y="197" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="end" font-weight="600">18</text><text x="500" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start" font-weight="600">=MOYENNE(client) rend 9 548,75.</text><rect x="6" y="250" width="746" height="180" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Trois pièges à connaître avant de citer un agrégat</text><rect x="14" y="280" width="730" height="40" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">1. Agréger du texte</text><text x="22" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">=SOMME(ventes_brutes!M2:M490) rend 0 et =NB rend 3 : les 489 montants sont du texte, aucune erreur affichée.</text><rect x="14" y="324" width="730" height="40" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="340" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">2. Une condition sur une colonne texte</text><text x="22" y="358" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">=SOMME.SI.ENS([montant_ttc];[date];"&gt;=01/09/2025") rend 0 sur le fichier reçu : les dates sont du texte.</text><rect x="14" y="368" width="730" height="40" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">3. Le quartile qui change de méthode</text><text x="22" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">QUARTILE.INC rend 12 950 / 74 234 ; QUARTILE.EXC rend 12 891,5 / 74 304,5. Même question, deux réponses.</text><text x="18" y="422" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Réflexe : un compte de lignes à côté de chaque agrégat — 8 754 982 FCFA sur 57 lignes ne se lit pas comme sur 480.</text></svg>