<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">L'étape 6 : la borne accuse, la preuve condamne, la décision écrit sa ligne</text><text x="20" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Une anomalie non prouvée est un soupçon — on le signale, on ne le traite pas. Les 3 témoins, les 4 cas du socle.</text><rect x="20" y="60" width="240" height="92" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">TÉMOIN 1 — POSITION</text><text x="32" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1a1a1a" text-anchor="start">Q1/Q3, iqr, bornes de Tukey</text><text x="32" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">442 sous la borne : plausible</text><rect x="273" y="60" width="240" height="92" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="285" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">TÉMOIN 2 — RÉCURRENCE</text><text x="285" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1a1a1a" text-anchor="start">hier + entrées - sorties = aujourd'hui</text><text x="285" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">545 déduit pour -12 : condamné</text><rect x="526" y="60" width="240" height="92" rx="4" fill="#f0f4ee" stroke="#9db88f" stroke-width="1.2"/><text x="538" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">TÉMOIN 3 — MÉTIER</text><text x="538" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#1a1a1a" text-anchor="start">stock &gt;= 0 · note sur 20 · période</text><text x="538" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#5a3a10" text-anchor="start" font-weight="600">pas de -12 boîtes : parle seul</text><text x="20" y="186" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="start" font-weight="600">Les 4 cas du socle, jugés (preuve -&gt; décision -&gt; ligne de rapport)</text><text x="36" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start" font-weight="600">CAS</text><text x="250" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start" font-weight="600">PREUVE</text><text x="470" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start" font-weight="600">DÉCISION</text><rect x="20" y="222" width="740" height="2" rx="0" fill="#c9d3dd" stroke="#c9d3dd" stroke-width="1"/><rect x="20" y="236" width="740" height="52" rx="4" fill="#f0f4ee" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">4 stocks négatifs (-1, -3, -2, -12)</text><text x="250" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">métier + récurrence (double)</text><text x="470" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">CORRIGER : 411, 253, 278, 545</text><rect x="20" y="296" width="740" height="52" rx="4" fill="#fbf7f0" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">1 date au 2027-01-05 (C000001)</text><text x="250" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">borne période + 1ère référence</text><text x="470" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">EXCLURE de la série · confirmer source</text><rect x="20" y="356" width="740" height="52" rx="4" fill="#fff0f0" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">ruptures M01 3j · M02 5j · M04 2j</text><text x="250" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">zéros vrais (récurrence OK)</text><text x="470" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">GARDER : signal métier, pas défaut</text><rect x="20" y="416" width="740" height="52" rx="4" fill="#f4f8fc" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="446" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">6 ventes au max 594 363 (fil rouge)</text><text x="250" y="446" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">plafond : 10 x 49 946.47 x 0.19</text><text x="470" y="446" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">GARDER : rareté légitime, pas doublon</text><rect x="20" y="484" width="740" height="30" rx="4" fill="#eef2f7" stroke="#8fa8c2" stroke-width="1.2"/><text x="36" y="504" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start" font-weight="600">Jamais la 4e décision : « je supprime » sans ligne — le silence est le seul vice ; la table P4 se re-joue.</text></svg>