<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Anatomie d'une table — 6 attributs + le squelette CREATE TABLE</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Une table n'est pas un fichier plat : elle est un objet à 6 attributs portees par le SGBD.</text><rect x="20" y="80" width="740" height="38" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">1. Nom</text><text x="200" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">client</text><text x="390" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">l'identifiant unique, non-renommable</text><rect x="20" y="124" width="740" height="38" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">2. Schéma</text><text x="200" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">11 colonnes</text><text x="390" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">la structure, distincte des donnees</text><rect x="20" y="168" width="740" height="38" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">3. Types</text><text x="200" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">INTEGER, TEXT, DATE</text><text x="390" y="184" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">chaque colonne a un type logique</text><rect x="20" y="212" width="740" height="38" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">4. Contraintes</text><text x="200" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">NOT NULL, UNIQUE, CHECK</text><text x="390" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">les regles que les donnees suivent</text><rect x="20" y="256" width="740" height="38" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">5. Lignes</text><text x="200" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">0 a 1 891</text><text x="390" y="272" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">les donnees qui respectent le schema</text><rect x="20" y="300" width="740" height="38" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">6. PK</text><text x="200" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a3b12" text-anchor="start" font-weight="600">id_client INTEGER</text><text x="390" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">l'identifiant unique d'une ligne</text><rect x="20" y="350" width="740" height="100" rx="4" fill="#f7fafc" stroke="#1f4e79" stroke-width="1"/><text x="36" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Squelette : CREATE TABLE nom (col1 type contraintes, ..., PK, FK)</text><text x="36" y="392" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">CREATE TABLE client (</text><text x="60" y="408" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">id_client INTEGER PRIMARY KEY,</text><text x="60" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">telephone TEXT NOT NULL UNIQUE,</text><text x="60" y="440" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">fidelite_niveau TEXT DEFAULT 'COMPTOIR' CHECK (fidelite_niveau IN (...))</text><text x="36" y="458" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">);</text></svg>