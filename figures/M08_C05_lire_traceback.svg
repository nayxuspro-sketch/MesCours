<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Lire une traceback : les 3 couches</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Une erreur avec des fonctions a une hauteur : la pile d'appels. La lire, c'est le travail.</text><rect x="20" y="70" width="430" height="272" rx="4" fill="#ffffff" stroke="#8fa3b5" stroke-width="1.2"/><text x="36" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">La protestation réelle (exécutée dans l'atelier) :</text><text x="36" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">Traceback (most recent call last):</text><text x="36" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start" font-weight="600">  File "&lt;string&gt;", line 4, in &lt;module&gt;</text><text x="36" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start">    print(calculer_net(1500))</text><text x="36" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start" font-weight="600">  File "&lt;string&gt;", line 3, in calculer_net</text><text x="36" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start">    return montant * (1 - remise)</text><text x="36" y="218" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#b3541e" text-anchor="start" font-weight="600">                          ^^^^^^</text><text x="36" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#b3541e" text-anchor="start" font-weight="600">NameError: name 'remise' is not defined</text><rect x="466" y="84" width="294" height="62" rx="4" fill="#eef2f6" stroke="#5b7fa6" stroke-width="1.2"/><text x="478" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">1 · La pile d'appels</text><text x="478" y="122" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">le chemin parcouru, du haut vers le bas</text><text x="478" y="136" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">(le module appelle calculer_net)</text><rect x="466" y="162" width="294" height="62" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="478" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">2 · La ligne fautive + la fleche</text><text x="478" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">l'erreur est DANS la fonction ;</text><text x="478" y="214" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">l'appel (cadre du haut) est le témoin</text><rect x="466" y="240" width="294" height="62" rx="4" fill="#f4f7fa" stroke="#8fa3b5" stroke-width="1.2"/><text x="478" y="260" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">3 · Le message, tout en bas</text><text x="478" y="278" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">le nom de la famille d'abord :</text><text x="478" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">NameError, pas la phrase</text><line x1="466" y1="115" x2="452" y2="140" stroke="#5b7fa6" stroke-width="1.4" marker-end="url(#f)"/><line x1="466" y1="193" x2="452" y2="200" stroke="#b3541e" stroke-width="1.4" marker-end="url(#f)"/><line x1="466" y1="271" x2="452" y2="244" stroke="#8fa3b5" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="368" width="740" height="76" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">La discipline : lire de haut en bas pour le POURQUOI, s'arrêter en bas pour le QUOI.</text><text x="36" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">Les 5 familles du debutant : SyntaxError (texte) · NameError (nom) · TypeError (famille)</text><text x="36" y="430" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">· ValueError (valeur) · KeyError / FileNotFoundError (cle / fichier)</text></svg>