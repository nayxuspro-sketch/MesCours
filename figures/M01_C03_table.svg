="266" y="102" width="68" height="24" fill="#f7f8fa" stroke="#c3ccd8" stroke-width="0.6"/><text x="271" y="118" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">Salamatu S.</text><rect x="334" y="102" width="46" height="24" fill="#f7f8fa" stroke="#c3ccd8" stroke-width="0.6"/><text x="339" y="118" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start"></text><rect x="380" y="102" width="54" height="24" fill="#f7f8fa" stroke="#c3ccd8" stroke-width="0.6"/><text x="385" y="118" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">2 000</text><rect x="434" y="102" width="92" height="24" fill="#f7f8fa" stroke="#c3ccd8" stroke-width="0.6"/><text x="439" y="118" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">21 950</text><rect x="526" y="102" width="82" height="24" fill="#f7f8fa" stroke="#c3ccd8" stroke-width="0.6"/><text x="531" y="118" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">51 802</text><rect x="10" y="126" width="132" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="15" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">T05-250102-075902</text><rect x="142" y="126" width="62" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="147" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">2025-01-02</text><rect x="204" y="126" width="62" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="209" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">Magasin 5</text><rect x="266" y="126" width="68" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="271" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">Adama B.</text><rect x="334" y="126" width="46" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="339" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">3312</text><rect x="380" y="126" width="54" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="385" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">1</text><rect x="434" y="126" width="92" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="439" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">14 000</text><rect x="526" y="126" width="82" height="24" fill="#fff" stroke="#c3ccd8" stroke-width="0.6"/><text x="531" y="142" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="start">16 520</text><rect x="10" y="54" width="132" height="48" fill="none" stroke="#b07a10" stroke-width="1.6"/><text x="128" y="95" font-size="12" font-weight="normal" fill="#b07a10" text-anchor="start">①</text><rect x="334" y="78" width="46" height="24" fill="none" stroke="#1a7f4b" stroke-width="1.6"/><text x="366" y="95" font-size="12" font-weight="normal" fill="#1a7f4b" text-anchor="start">②</text><rect x="334" y="102" width="46" height="24" fill="none" stroke="#b3261e" stroke-width="1.6"/><text x="366" y="119" font-size="12" font-weight="normal" fill="#b3261e" text-anchor="start">③</text><text x="10" y="170" font-size="10.5" font-weight="normal" fill="#b07a10" text-anchor="start">① un ticket occupe 2 lignes : compter les lignes pour compter les ventes gonfle le résultat de 55 %</text><text x="10" y="185" font-size="10.5" font-weight="normal" fill="#b07a10" text-anchor="start">     (le fichier compte 489 lignes, 316 tickets, et jusqu'à 4 lignes pour un même ticket).</text><text x="10" y="203" font-size="10.5" font-weight="normal" fill="#1a7f4b" text-anchor="start">② « 0.0 » n'est pas un manque : c'est la vente au comptoir, sans client identifié.</text><text x="10" y="218" font-size="10.5" font-weight="normal" fill="#1a7f4b" text-anchor="start">     Elle est volontaire dans le fichier et doit rester dans les totaux.</text><text x="10" y="236" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="start">③ cellule vide = valeur absente : 18 lignes du fichier sont dans ce cas.</text><text x="10" y="251" font-size="10.5" font-weight="normal" fill="#b3261e" text-anchor="start">     On signale, on documente, on ne remplit pas au hasard.</text><text x="10" y="269" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">· Grain : une ligne = un article vendu sur un ticket ; 1,52 ligne par ticket en moyenne.</text><text x="10" y="284" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">· Clé : n_ticket identifie le ticket ; (n_ticket, produit) identifie la ligne. Sans clé, pas de fusion propre.</text><text x="10" y="299" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">· Schéma : les 13 colonnes et leur type. Le CSV ne le dit pas : le déduire, puis le vérifier.</text><text x="8" y="333" font-size="11" fill="#6a7382">Figure 3 — Les quatre premières lignes réelles du fichier de l'atelier, annotées.</text></svg>