<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Mesurer la vecteurisation : boucle for vs une ligne</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Mesuré le 19/09/2026 (atelier) — 50 008 montants réels du socle ; le rapport tient, l'absolu change de machine.</text><rect x="20" y="70" width="360" height="272" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><text x="36" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Mesure 1 — la somme</text><text x="36" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start" font-weight="600">boucle for — montant par montant</text><rect x="36" y="128" width="280" height="26" rx="3" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="324" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">3,8 ms</text><text x="36" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start" font-weight="600">np.sum(montants) — une ligne</text><rect x="36" y="190" width="12" height="26" rx="3" fill="#eef2f6" stroke="#5b7fa6" stroke-width="1"/><text x="56" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">0,149 ms</text><text x="36" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#b3541e" text-anchor="start" font-weight="600">rapport : 25×</text><text x="36" y="276" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">même total des deux côtés :</text><text x="36" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">7 908 259 732,20 FCFA</text><text x="36" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">(l'absolu est petit : 50 000 éléments ;</text><text x="36" y="332" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">le rapport, lui, est stable)</text><rect x="400" y="70" width="360" height="272" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2"/><text x="416" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Mesure 2 — le contrôle qualité de C03</text><text x="416" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start" font-weight="600">boucle for — isinstance + test + compteur</text><rect x="416" y="128" width="280" height="26" rx="3" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="704" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">6,2 ms</text><text x="416" y="182" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#12365a" text-anchor="start" font-weight="600">vecteur — (m &gt; 100000).sum()</text><rect x="416" y="190" width="9" height="26" rx="3" fill="#eef2f6" stroke="#5b7fa6" stroke-width="1"/><text x="433" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">0,193 ms</text><text x="416" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#b3541e" text-anchor="start" font-weight="600">rapport : 32×</text><text x="416" y="276" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">même comptage des deux côtés :</text><text x="416" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start" font-weight="600">28 065 « gros »</text><text x="416" y="318" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">(la boucle fait plus de Python</text><text x="416" y="332" font-family="Inter, Segoe UI, sans-serif" font-size="8" fill="#42566b" text-anchor="start">par élément → le rapport monte)</text><rect x="20" y="368" width="740" height="76" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="36" y="390" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">La leçon : la vecteurisation ne change PAS la réponse — elle change le chemin.</text><text x="36" y="412" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">Publier une vitesse = les deux temps + le rapport + la date + la taille : un rapport non daté est une opinion,</text><text x="36" y="430" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#33475b" text-anchor="start">un rapport mesuré et daté est une preuve.</text></svg>