<svg xmlns="http://www.w3.org/2000/svg" width="760" height="254" viewBox="0 0 760 254" font-family="DejaVu Sans"><rect width="760" height="254" fill="#ffffff"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4653"/></marker></defs><text x="10" y="18" font-size="13.5" font-weight="bold" fill="#1c2430" text-anchor="start">Qui fait quoi, et les cinq questions à écrire avant de toucher un fichier</text><rect x="10" y="32" width="136" height="26" rx="6" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.9"/><text x="78.0" y="49.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">DATA ENGINEER</text><text x="78" y="74" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">prépare flux,</text><text x="78" y="87" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">bases, qualité</text><text x="78" y="103" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">Airflow · SQL · DuckDB</text><rect x="158" y="32" width="136" height="26" rx="6" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.9"/><text x="226.0" y="49.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">DATA ANALYST</text><text x="226" y="74" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">pose les questions,</text><text x="226" y="87" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">mesure, explique</text><text x="226" y="103" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">Excel · SQL · Python</text><line x1="144" y1="45" x2="156" y2="45" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="306" y="32" width="136" height="26" rx="6" fill="#fdf3dd" stroke="#3c4653" stroke-width="0.9"/><text x="374.0" y="49.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">BI ANALYST</text><text x="374" y="74" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">modélise, construit</text><text x="374" y="87" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">les tableaux durables</text><text x="374" y="103" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">Power BI · DAX</text><line x1="292" y1="45" x2="304" y2="45" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="454" y="32" width="136" height="26" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="522.0" y="49.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">DATA SCIENTIST</text><text x="522" y="74" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">prévoit, teste,</text><text x="522" y="87" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">modélise l'inconnu</text><text x="522" y="103" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">Python · R · stats</text><line x1="440" y1="45" x2="452" y2="45" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="602" y="32" width="136" height="26" rx="6" fill="#f7f7f5" stroke="#3c4653" stroke-width="0.9"/><text x="670.0" y="49.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">DÉCIDEUR</text><text x="670" y="74" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">choisit, assume,</text><text x="670" y="87" font-size="10" font-weight="normal" fill="#1c2430" text-anchor="middle">finance</text><text x="670" y="103" font-size="10" font-weight="normal" fill="#41505f" text-anchor="middle">votre note de 2 pages</text><line x1="588" y1="45" x2="600" y2="45" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><line x1="10" y1="116" x2="750" y2="116" stroke="#c3ccd8"/><text x="14" y="134" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="start">1. Décision visée — qu'est-ce qui changera selon la réponse ?</text><text x="14" y="151" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">2. Question analytique — une phrase : unité (FCFA TTC), période (2025), périmètre (magasin 5), comparaison.</text><text x="14" y="168" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">3. Donnée nécessaire — la table, le grain, la colonne, le fichier exact.</text><text x="14" y="185" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">4. Critère de réussite — le chiffre attendu, la tolérance, qui valide, avant de calculer.</text><text x="14" y="202" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">5. Limites — ce que le résultat ne dira pas : ici, pas de marge nette (aucun coût de structure dans le jeu).</text><text x="8" y="245" font-size="11" fill="#6a7382">Figure 7 — La chaîne de valeur, et le formulaire de cadrage resservi dans les 22 modules.</text></svg>