<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="6" y="22" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Doublons : ce que chaque niveau de clé voit, et ce qu’il laisse passer</text><text x="6" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le même fichier, quatre questions. Une seule tombe sur le bon tas de lignes.</text><rect x="6" y="58" width="470" height="46" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="77" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Ligne entièrement identique</text><text x="16" y="93" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">colonne par colonne, A à Z</text><text x="340" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">0 ligne</text><rect x="486" y="58" width="288" height="46" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="496" y="85" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">aucun copié-collé intégral dans le fichier</text><rect x="6" y="112" width="470" height="46" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="131" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Clé technique · id_vente</text><text x="16" y="147" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">243 360 valeurs distinctes</text><text x="340" y="139" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">0 doublon</text><rect x="486" y="112" width="288" height="46" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="496" y="139" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">la clé du fichier est vierge de soupçon</text><rect x="6" y="166" width="470" height="46" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="185" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Ticket + produit + quantité</text><text x="16" y="201" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">collision sur la clé métier</text><text x="340" y="193" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a3b12" text-anchor="end" font-weight="600">3 440 lignes</text><rect x="486" y="166" width="288" height="46" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="496" y="193" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">le seul test qui voie le défaut</text><rect x="6" y="220" width="470" height="46" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="239" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Ticket + produit, sans quantité</text><text x="16" y="255" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">toutes les lignes concernées</text><text x="340" y="247" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600">8 453 lignes</text><rect x="486" y="220" width="288" height="46" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="496" y="247" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">le dénominateur à citer, pas le résultat</text><rect x="6" y="274" width="768" height="84" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">L’entonnoir, et ce qui reste à traiter :</text><text x="16" y="310" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">243 360 lignes  →  97 199 partagent un ticket (normal : 1,67 ligne par ticket)</text><text x="16" y="325" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→  8 453 lignes en collision  →  3 440 collisions sur la clé complète</text><text x="16" y="340" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">→  3 360 lignes à retirer  →  dont 61 aussi en montant texte (le recouvrement)</text><rect x="6" y="368" width="768" height="116" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="386" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">La trace du mécanisme, lue dans l’ordre des identifiants :</text><text x="16" y="406" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3 360 doublons, tous numérotés après leur original — écart médian 123 285, le plus proche 838</text><text x="16" y="419" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">position médiane dans le fichier : 99,3 % du parcours. Un bloc ajouté à la fin :</text><text x="16" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">signal d’un export rejoué sur une période récente, jamais d’une double saisie au clavier.</text><text x="16" y="445" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="600">Règle de garde : le plus petit id_vente du groupe, jamais le dernier.</text><text x="16" y="458" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">3 346 fois sur 3 360 le montant est identique des deux côtés ; les 14 autres divergent —</text><text x="16" y="471" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">leur règle ne peut pas être « la première venue » mais « la première conforme à ht + tva ».</text></svg>