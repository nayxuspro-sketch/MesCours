2" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text><text x="10" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="middle">2</text><text x="10" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="middle">3</text><text x="10" y="144" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#6b7785" text-anchor="middle">4</text><rect x="18" y="152" width="440" height="24" rx="4" fill="#fff3cd" stroke="#e0a800" stroke-width="1.4"/><text x="24" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start">… 486 lignes …</text><text x="124" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start" font-weight="600">491 collée après : hors du filtre, hors des totaux</text><text x="18" y="192" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le filtre porte une adresse figée : à chaque import, on la refait.</text><text x="18" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start">Trier une colonne seule : lignes désynchronisées, aucun signal.</text><rect x="6" y="228" width="470" height="130" rx="4" fill="#f4f9f4" stroke="#3f7d3f" stroke-width="1"/><text x="18" y="246" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#3f7d3f" text-anchor="start" font-weight="600">Tableau structuré — TableVentes, A1:M481 (Ctrl+L)</text><rect x="18" y="254" width="440" height="20" rx="4" fill="#eaf5ea" stroke="#cfe3cf" stroke-width="1"/><text x="24" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start" font-weight="600">n_ticket</text><text x="174" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start" font-weight="600">quantite</text><text x="244" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start" font-weight="600">montant_ttc</text><rect x="18" y="274" width="150" height="18" rx="4" fill="#ffffff" stroke="#e9eef4" stroke-width="1"/><rect x="168" y="274" width="70" height="18" rx="4" fill="#ffffff" stroke="#e9eef4" stroke-width="1"/><rect x="238" y="274" width="110" height="18" rx="4" fill="#ffffff" stroke="#e9eef4" stroke-width="1"/><rect x="348" y="274" width="110" height="18" rx="4" fill="#ffffff" stroke="#e9eef4" stroke-width="1"/><text x="24" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">T05-250101-075845</text><text x="174" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">11</text><text x="244" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">56 658</text><text x="354" y="290" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text><rect x="18" y="292" width="150" height="18" rx="4" fill="#eef6ee" stroke="#e9eef4" stroke-width="1"/><rect x="168" y="292" width="70" height="18" rx="4" fill="#eef6ee" stroke="#e9eef4" stroke-width="1"/><rect x="238" y="292" width="110" height="18" rx="4" fill="#eef6ee" stroke="#e9eef4" stroke-width="1"/><rect x="348" y="292" width="110" height="18" rx="4" fill="#eef6ee" stroke="#e9eef4" stroke-width="1"/><text x="24" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">T05-250101-075846</text><text x="174" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2 000</text><text x="244" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">51 802</text><text x="354" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text><rect x="18" y="312" width="440" height="22" rx="4" fill="#eaf5ea" stroke="#3f7d3f" stroke-width="1"/><text x="24" y="327" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">Total → 36 073 185 FCFA · ligne 481 : le tableau s’étend</text><text x="18" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start">colonne N restée dehors : la 14e ne suit pas toute seule</text><rect x="490" y="6" width="262" height="352" rx="4" fill="#fff8f0" stroke="#e0a800" stroke-width="1"/><text x="500" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">Supprimer les doublons :</text><text x="500" y="42" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">tout se décide sur la clé</text><text x="500" y="70" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600">les 13 colonnes</text><rect x="500" y="78" width="242" height="16" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="78" width="12" height="16" rx="2" fill="#3f7d3f" stroke="#3f7d3f" stroke-width="1"/><text x="500" y="110" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#3f7d3f" text-anchor="start">9 lignes · 266 132 FCFA</text><text x="500" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600">ticket + produit</text><rect x="500" y="154" width="242" height="16" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="154" width="16" height="16" rx="2" fill="#a1650b" stroke="#a1650b" stroke-width="1"/><text x="500" y="186" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start">12 lignes · 481 978 FCFA</text><text x="500" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600">ticket seul</text><rect x="500" y="230" width="242" height="16" rx="4" fill="#fdf3e6" stroke="#e8d6bd" stroke-width="1"/><rect x="500" y="230" width="242" height="16" rx="2" fill="#a33636" stroke="#a33636" stroke-width="1"/><text x="500" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start">173 lignes · 11 424 263 FCFA</text><text x="500" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start" font-weight="600">Un ticket porte plusieurs lignes :</text><text x="500" y="308" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">489 lignes, 316 tickets — dédoubler</text><text x="500" y="324" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">sur le ticket efface 173 ventes</text><text x="500" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a33636" text-anchor="start" font-weight="600">réelles, 11 424 263 FCFA</text><rect x="6" y="366" width="746" height="68" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Trier : sélectionner toute la ligne, ou cliquer dans le tableau ; puis deux niveaux — date, puis n_ticket.</text><text x="18" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Filtrer : 40 lignes par mois × 12 mois = 480 · Matériaux → 143 · contient « Sable » → 11 · quantité &gt; 50 → 3.</text><text x="18" y="420" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le filtre « Magasin » rend 480 lignes sur 480 : un filtre qui ne filtre rien est un filtre à supprimer.</text></svg>