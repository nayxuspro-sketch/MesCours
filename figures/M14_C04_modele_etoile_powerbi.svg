   <g id="text_32">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="34.485856" y="270.597001" transform="rotate(-0 34.485856 270.597001)">la commande porte trois dates (commande, promise, livree) pour une seule table de dates :</text>
   </g>
   <g id="text_33">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="34.485856" y="279.600457" transform="rotate(-0 34.485856 279.600457)">la date promise reste inactive et s'active dans la mesure du taux de service ; la date de</text>
   </g>
   <g id="text_34">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #333333" x="34.485856" y="288.603913" transform="rotate(-0 34.485856 288.603913)">livraison reste inactive, parce que le rapport se lit par date de commande.</text>
   </g>
   <g id="text_35">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a2f2f" x="34.485856" y="299.159689" transform="rotate(-0 34.485856 299.159689)">Le piege : relier la date a une colonne NON unique comme annee_mois, c'est 44 lignes de calendrier</text>
   </g>
   <g id="text_36">
    <text style="font-size: 6.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a2f2f" x="34.485856" y="308.163145" transform="rotate(-0 34.485856 308.163145)">par mois ; chaque ligne de vente se repete et le chiffre d'affaires est multiplie par 44.</text>
