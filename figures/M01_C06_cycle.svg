<svg xmlns="http://www.w3.org/2000/svg" width="760" height="216" viewBox="0 0 760 216" font-family="DejaVu Sans"><rect width="760" height="216" fill="#ffffff"/><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3c4653"/></marker></defs><text x="10" y="18" font-size="13.5" font-weight="bold" fill="#1c2430" text-anchor="start">Le voyage d'une ligne, de la caisse au rapport annuel</text><rect x="10" y="30" width="108" height="26" rx="6" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.9"/><text x="64.0" y="47.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">NAISSANCE</text><text x="64" y="72" font-size="9" font-weight="normal" fill="#1c2430" text-anchor="middle">caisse magasin 5</text><text x="64" y="84" font-size="9" font-weight="normal" fill="#41505f" text-anchor="middle">01/01/2025 11:01</text><rect x="132" y="30" width="108" height="26" rx="6" fill="#e8f0fb" stroke="#3c4653" stroke-width="0.9"/><text x="186.0" y="47.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">STOCKAGE</text><text x="186" y="72" font-size="9" font-weight="normal" fill="#1c2430" text-anchor="middle">export CSV</text><text x="186" y="84" font-size="9" font-weight="normal" fill="#41505f" text-anchor="middle">28,5 Mo, brut</text><line x1="116" y1="43" x2="130" y2="43" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="254" y="30" width="108" height="26" rx="6" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.9"/><text x="308.0" y="47.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">TRANSFORMATION</text><text x="308" y="72" font-size="9" font-weight="normal" fill="#1c2430" text-anchor="middle">nettoyage</text><text x="308" y="84" font-size="9" font-weight="normal" fill="#41505f" text-anchor="middle">489 → 480 lignes</text><line x1="238" y1="43" x2="252" y2="43" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="376" y="30" width="108" height="26" rx="6" fill="#e8f5ec" stroke="#3c4653" stroke-width="0.9"/><text x="430.0" y="47.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">USAGE</text><text x="430" y="72" font-size="9" font-weight="normal" fill="#1c2430" text-anchor="middle">tableau de bord</text><text x="430" y="84" font-size="9" font-weight="normal" fill="#41505f" text-anchor="middle">12 lecteurs</text><line x1="360" y1="43" x2="374" y2="43" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="498" y="30" width="108" height="26" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="552.0" y="47.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">ARCHIVAGE</text><text x="552" y="72" font-size="9" font-weight="normal" fill="#1c2430" text-anchor="middle">classeur 2023-24</text><text x="552" y="84" font-size="9" font-weight="normal" fill="#41505f" text-anchor="middle">lecture seule</text><line x1="482" y1="43" x2="496" y2="43" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><rect x="620" y="30" width="108" height="26" rx="6" fill="#f0f0ee" stroke="#3c4653" stroke-width="0.9"/><text x="674.0" y="47.5" font-size="10.5" font-weight="bold" fill="#1c2430" text-anchor="middle">SUPPRESSION</text><text x="674" y="72" font-size="9" font-weight="normal" fill="#1c2430" text-anchor="middle">purge + registre</text><text x="674" y="84" font-size="9" font-weight="normal" fill="#41505f" text-anchor="middle">le dico survit</text><line x1="604" y1="43" x2="618" y2="43" stroke="#3c4653" stroke-width="1.1" marker-end="url(#f)"/><line x1="10" y1="98" x2="750" y2="98" stroke="#c3ccd8"/><text x="10" y="116" font-size="11" font-weight="normal" fill="#1c2430" text-anchor="start">Responsable : caissier → admin. de l'ERP → vous → le BI → la DAF → la DAF, encore.</text><text x="10" y="138" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">· Où le chiffre meurt : export coupé, fichier réécrasé, arrondi, filtre oublié, fusion dupliquée (+9 lignes ici).</text><text x="10" y="154" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">· Ce qui prouve votre travail dans trois ans : le journal de transformation et le dictionnaire, pas votre mémoire.</text><text x="10" y="170" font-size="10.5" font-weight="normal" fill="#1c2430" text-anchor="start">· Règle du manuel : on ne modifie jamais un fichier brut ; du brut on tire du propre, et on garde les deux.</text><text x="8" y="207" font-size="11" fill="#6a7382">Figure 6 — Six étapes, cinq responsables, et l'endroit exact où votre total peut disparaître.</text></svg>