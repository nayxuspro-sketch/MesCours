<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><rect x="6" y="6" width="400" height="250" rx="4" fill="#fbfdff" stroke="#9fb0c0" stroke-width="1"/><text x="18" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">Une clé, trois éclairages</text><text x="18" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">n_ticket = T05-250101-075845 (17 caractères)</text><rect x="18" y="54" width="376" height="26" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="26" y="71" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">T05-250101-075845</text><text x="22" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=GAUCHE(A2;3)</text><text x="176" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">T05</text><text x="252" y="100" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">le magasin (colonne D)</text><text x="22" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=STXT(A2;5;6)</text><text x="176" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">250101</text><text x="252" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">la date du ticket, vérifiée</text><text x="22" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=DROITE(A2;6)</text><text x="176" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">075845</text><text x="252" y="152" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">le n° du ticket, pas de la ligne</text><text x="22" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=NBCAR(A2)</text><text x="176" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">17</text><text x="252" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">17, ici comme en population</text><rect x="18" y="206" width="376" height="40" rx="4" fill="#f2f8f2" stroke="#9dbf9d" stroke-width="1"/><text x="26" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=JOINDRE.TEXTE(" — ";VRAI;[vendeur];[categorie])</text><text x="26" y="238" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="start">une clé de regroupage fabriquée, pas recopiée</text><rect x="420" y="6" width="332" height="250" rx="4" fill="#fff8f0" stroke="#e0a800" stroke-width="1"/><text x="432" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">Quatre pièges, un chiffre chacun</text><rect x="428" y="34" width="316" height="44" rx="4" fill="#ffffff" stroke="#e8d6bd" stroke-width="1"/><text x="436" y="48" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">1. Le 4e argument omis</text><text x="436" y="63" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">vaut VRAI : recherche approximative.</text><text x="436" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">0 faute ici, 233 sur 377 après un tri par nom.</text><rect x="428" y="82" width="316" height="44" rx="4" fill="#ffffff" stroke="#e8d6bd" stroke-width="1"/><text x="436" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">2. Le premier match seulement</text><text x="436" y="111" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">il ne rend qu'une ligne sur quatre.</text><text x="436" y="124" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">CA lu 24 915 054 au lieu de 36 073 185.</text><rect x="428" y="130" width="316" height="44" rx="4" fill="#ffffff" stroke="#e8d6bd" stroke-width="1"/><text x="436" y="144" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">3. #N/A se propage</text><text x="436" y="159" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">une clé absente contamine la formule fille.</text><text x="436" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">103 lignes : 85 zéros, 18 vides.</text><rect x="428" y="178" width="316" height="44" rx="4" fill="#ffffff" stroke="#e8d6bd" stroke-width="1"/><text x="436" y="192" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a1650b" text-anchor="start" font-weight="600">4. Rechercher à gauche</text><text x="436" y="207" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">RECHERCHEV n'en sait rien faire.</text><text x="436" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">id_produit est avant designation.</text><text x="432" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">RECHERCHEX ferme 3 et 4 ; INDEX/EQUIV ferme 2 et 4.</text><rect x="6" y="264" width="746" height="166" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="18" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">La même recherche, écrite de trois manières</text><rect x="14" y="297" width="730" height="26" rx="4" fill="#f2f6fa" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="312" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=RECHERCHEV(F2;clients!A:B;2;FAUX)</text><text x="404" y="312" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">une colonne insérée casse l’index 2</text><rect x="14" y="327" width="730" height="26" rx="4" fill="#ffffff" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=INDEX(clients!B:B;EQUIV(F2;clients!A:A;0))</text><text x="404" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">compatible 2019 et LibreOffice, sans index fixe</text><rect x="14" y="357" width="730" height="26" rx="4" fill="#f2f6fa" stroke="#e3eaf1" stroke-width="1"/><text x="22" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start">=RECHERCHEX(F2;clients!A:A;clients!B:B;"comptoir";0;-1)</text><text x="404" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">repli, match exact, et il cherche à gauche</text><text x="18" y="404" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#a1650b" text-anchor="start">=CNUM(SUBSTITUE(ventes_brutes!M2;" ";"")) rend 56 658 : réparer avant de chercher.</text><text x="18" y="422" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">RECHERCHEX et JOINDRE.TEXTE exigent Microsoft 365 ou Excel 2021 ; en 2019, ces noms rendent #NOM?.</text></svg>