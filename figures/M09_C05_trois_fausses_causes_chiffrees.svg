<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Corrélation, jamais causalité : les 3 fausses causes, chiffrées sur le socle</text><text x="20" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le brut : absentéisme x moyenne générale = -0.232 (n=400), association négative modérée. Trois façons de la lire en trop :</text><rect x="20" y="60" width="240" height="330" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">1 — VARIABLE TIERCE (confond)</text><text x="32" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">la tierce variable (le niveau d'origine)</text><text x="32" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">contrôle par bande de T1 :</text><rect x="32" y="136" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="40" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">brut (abs T2 x note T2) : -0.206</text><rect x="32" y="162" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="40" y="176" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">bande T1 [8,10)  n=107 : -0.145</text><rect x="32" y="188" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="40" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">bande T1 [10,12) n=139 : -0.085</text><rect x="32" y="214" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="40" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">bande T1 [12,14) n=77 : +0.163</text><text x="32" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start" font-weight="600">le lien s'EFFONDRE (et change de signe)</text><text x="32" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start">une part du lien brut = tierce variable,</text><text x="32" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start" font-weight="600">pas l'absence en elle-même.</text><rect x="273" y="60" width="240" height="330" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="285" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">2 — RÉGRESSION VERS LA MOYENNE</text><text x="285" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">les extrêmes reviennent vers le milieu</text><text x="285" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">la transition T1 -&gt; T2 :</text><rect x="285" y="136" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="293" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">T1 &lt; 8 (7.01) -&gt; T2 : 7.21 (monte)</text><rect x="285" y="162" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="293" y="176" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">T1 &gt; 14 (14.93) -&gt; T2 : 14.61 (desc.)</text><rect x="285" y="188" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="293" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">moyenne globale : 10.57</text><rect x="285" y="214" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="293" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">les deux sens, même chiffre : 10.57</text><text x="285" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start" font-weight="600">les deux extrêmes reviennent vers 10.57</text><text x="285" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start">sans qu'on les ait aidés : c'est la variance</text><text x="285" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start" font-weight="600">d'une note, pas « l'aide a marché ».</text><rect x="526" y="60" width="240" height="330" rx="4" fill="#f0f4ee" stroke="#9db88f" stroke-width="1.2"/><text x="538" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">3 — SENS INVERSÉ</text><text x="538" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">B cause A, on affirme A cause B</text><text x="538" y="126" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">le fichier ne départage pas :</text><rect x="538" y="136" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="546" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">absence -&gt; note ? (les absents chutent)</text><rect x="538" y="162" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="546" y="176" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">note -&gt; absence ? (chute -&gt; absences)</text><rect x="538" y="188" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="546" y="202" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">pas d'intervention, pas de variable</text><rect x="538" y="214" width="216" height="21" rx="2" fill="#ffffff" stroke="#c9d3dd" stroke-width="0.8"/><text x="546" y="228" font-family="Inter, Segoe UI, sans-serif" font-size="8.5" fill="#1a1a1a" text-anchor="start">motivation ni d'ordre chronologique</text><text x="538" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start" font-weight="600">les deux sens restent compatibles avec</text><text x="538" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start">les mêmes chiffres : le fichier ne tranche</text><text x="538" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#5a3a10" text-anchor="start" font-weight="600">Phrase : association, sens non départagé.</text><rect x="20" y="404" width="740" height="56" rx="4" fill="#eef2f7" stroke="#8fa8c2" stroke-width="1.4"/><text x="36" y="426" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#12365a" text-anchor="start" font-weight="600">Le coefficient va avec ses 4 chiffres : -0.232 · n = 400 · contrôle (bandes de T1) · limite (proxy, 1 année, sens)</text><text x="36" y="446" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start">les 4 ensemble, ou la phrase ne part pas. Test du scale : montants 0.552 -&gt; taux 0.001 — le scale n'est pas le comportement.</text><rect x="20" y="470" width="740" height="44" rx="4" fill="#f0f4ee" stroke="#9db88f" stroke-width="1.2"/><text x="36" y="488" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#3d5a2e" text-anchor="start" font-weight="600">Segments (bornes métier, avant de regarder) : 123 / 208 / 69 élèves -&gt; moyennes 11.13 / 10.51 / 9.76</text><text x="36" y="504" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#3d5a2e" text-anchor="start">gradient régulier = la signature d'un lien direct (pas une fausse cause).</text></svg>