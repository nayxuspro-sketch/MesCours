<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">L'entonnoir WHERE : filtrer les lignes, etape par etape</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Une requete SELECT traverse 8 etapes ; le WHERE agit en 2e position.</text><rect x="20" y="80" width="200" height="50" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="36" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">1. FROM</text><text x="36" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">charger la table</text><text x="640" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">lignes : 50 008</text><text x="640" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">50008 ventes</text><rect x="35" y="140" width="170" height="50" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="51" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">2. WHERE</text><text x="51" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">filtrer (avant agregat)</text><text x="640" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">selon condition</text><rect x="50" y="200" width="140" height="50" rx="4" fill="#ffffff" stroke="#1f4e79" stroke-width="1.5"/><text x="66" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">3. SELECT</text><text x="66" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">projeter (colonnes / alias)</text><text x="640" y="222" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">sortie tabulaire</text><rect x="65" y="260" width="110" height="50" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="81" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">4. ORDER BY</text><text x="81" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">trier (option)</text><text x="640" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">selon cle</text><rect x="80" y="320" width="80" height="50" rx="4" fill="#ffffff" stroke="#7a3b12" stroke-width="1.5"/><text x="96" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">5. LIMIT</text><text x="96" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">tronquer (option)</text><text x="640" y="342" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">5 premieres</text><rect x="20" y="380" width="740" height="90" rx="4" fill="#fdf7f4" stroke="#7a3b12" stroke-width="1"/><text x="36" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7a3b12" text-anchor="start" font-weight="600">Pieges frequents du WHERE</text><text x="36" y="422" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">= NULL ne marche jamais (utiliser IS NULL)</text><text x="36" y="438" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">AND est plus prioritaire que OR (toujours parentheses)</text><text x="36" y="454" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">BETWEEN inclut les DEUX bornes (la borne superieure n'est pas exclue)</text></svg>