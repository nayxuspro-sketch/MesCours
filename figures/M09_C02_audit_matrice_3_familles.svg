<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">L'audit (étape 3) : 3 familles de défauts, 3 contrôles, 3 exemples chiffrés</text><text x="20" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Chaque défaut porte sa définition exacte — sans elle, le chiffre n'est pas publiable (P2 lit la définition).</text><text x="36" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">FAMILLE</text><text x="158" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">DÉFINITION EXACTE</text><text x="508" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start" font-weight="600">CHIFFRE DU SOCLE</text><rect x="20" y="86" width="740" height="2" rx="0" fill="#c9d3dd" stroke="#c9d3dd" stroke-width="1"/><rect x="20" y="106" width="740" height="86" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="36" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Doublons</text><text x="158" y="134" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">lignes (ou clés) répétées — définies AVANT de compter</text><text x="508" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">7 lignes de stock (5-tuple identique) · </text><text x="508" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">8 métier hors id_vente</text><text x="36" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">contrôle : duplicated(subset=clés métier)</text><rect x="20" y="202" width="740" height="86" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="36" y="230" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Manquants</text><text x="158" y="230" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">valeur absente : NaN OU chaîne vide codée en clair</text><text x="508" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">23 motifs vides sur 18 818 consultations</text><text x="508" y="244" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600"></text><text x="36" y="264" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">contrôle : isna().sum() + chaînes vides sur les textes</text><rect x="20" y="298" width="740" height="86" rx="4" fill="#f0f4ee" stroke="#9db88f" stroke-width="1.2"/><text x="36" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Impossible</text><text x="158" y="326" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">hors borne métier ou hors récurrence du flux</text><text x="508" y="322" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">4 stocks négatifs (min -12) · 1 date au </text><text x="508" y="340" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#5a3a10" text-anchor="start" font-weight="600">2027-01-05</text><text x="36" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">contrôle : bornes métier + récurrence (hier + in - out)</text><rect x="20" y="402" width="740" height="60" rx="4" fill="#fff0f0" stroke="#d98c8c" stroke-width="1.4"/><text x="36" y="422" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#7a2020" text-anchor="start" font-weight="600">L'audit vide est suspect, pas réconfortant : 3 contrôles avant de publier « propre ».</text><text x="36" y="440" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">(1) isna par colonne (pas en somme) · (2) chaînes vides sur les textes</text><text x="36" y="456" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#7a2020" text-anchor="start">(3) clés refermées sur les tables jointes — sur vente.csv : 0 / 0 / 0 vérifié = audit validé vide.</text><rect x="20" y="470" width="740" height="26" rx="4" fill="#eef2f7" stroke="#8fa8c2" stroke-width="1.2"/><text x="36" y="489" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="start" font-weight="600">Puis l'étape 4 : les statistiques juste nécessaires — médiane 29.0 vs moyenne 25.74/jour, iqr, bornes de Tukey (442 vs -12).</text></svg>