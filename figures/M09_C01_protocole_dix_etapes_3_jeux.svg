<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">Le protocole EDA : 10 étapes, un contrat — une étape se déclare, jamais sautée</text><text x="20" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Chaque étape = une question posée au jeu + l'outil principal ; le fil rouge (quincaillerie) parcourt les 10.</text><rect x="20" y="58" width="356" height="80" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="600">1</text><text x="54" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Inspecter</text><text x="32" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Qu'est-ce que j'ai en main ?</text><text x="32" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">shape, dtypes, head, info</text><line x1="376" y1="98.0" x2="394" y2="98.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="396" y="58" width="356" height="80" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="408" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a4a12" text-anchor="start" font-weight="600">2</text><text x="430" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5a3a10" text-anchor="start" font-weight="600">Comprendre</text><text x="408" y="102" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Que veut dire chaque colonne ?</text><text x="408" y="120" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">la fiche d'entrée (30 min)</text><rect x="20" y="146" width="356" height="80" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="600">3</text><text x="54" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Détecter</text><text x="32" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Doublons, manquants, impossible ?</text><text x="32" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">duplicated, isna, bornes</text><line x1="376" y1="186.0" x2="394" y2="186.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="396" y="146" width="356" height="80" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="408" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a4a12" text-anchor="start" font-weight="600">4</text><text x="430" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5a3a10" text-anchor="start" font-weight="600">Statistiques</text><text x="408" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Quelle forme par variable ?</text><text x="408" y="208" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">describe, quartiles, value_counts</text><rect x="20" y="234" width="356" height="80" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="600">5</text><text x="54" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Tendances</text><text x="32" y="278" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ca monte, descend, cycle ?</text><text x="32" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">resample, moyenne glissante</text><line x1="376" y1="274.0" x2="394" y2="274.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="396" y="234" width="356" height="80" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="408" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a4a12" text-anchor="start" font-weight="600">6</text><text x="430" y="256" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5a3a10" text-anchor="start" font-weight="600">Anomalies</text><text x="408" y="278" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Inhabituel, et comment prouver ?</text><text x="408" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">iqr, récurrence, métier</text><rect x="20" y="322" width="356" height="80" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="600">7</text><text x="54" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Relations</text><text x="32" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Bougent-elles ensemble ?</text><text x="32" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">corr, croisé, segments</text><line x1="376" y1="362.0" x2="394" y2="362.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="396" y="322" width="356" height="80" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="408" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a4a12" text-anchor="start" font-weight="600">8</text><text x="430" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5a3a10" text-anchor="start" font-weight="600">Hypothèses</text><text x="408" y="366" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Que puis-je affirmer ?</text><text x="408" y="384" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">formulation falsifiable</text><rect x="20" y="410" width="356" height="80" rx="4" fill="#f4f8fc" stroke="#8fa8c2" stroke-width="1.2"/><text x="32" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="600">9</text><text x="54" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#12365a" text-anchor="start" font-weight="600">Visuels</text><text x="32" y="454" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Quel graphique répond ?</text><text x="32" y="472" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">courbe, barres, boxplot, nuage</text><line x1="376" y1="450.0" x2="394" y2="450.0" stroke="#1f4e79" stroke-width="1.4" marker-end="url(#f)"/><rect x="396" y="410" width="356" height="80" rx="4" fill="#fbf7f0" stroke="#d9b38c" stroke-width="1.2"/><text x="408" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#7a4a12" text-anchor="start" font-weight="600">10</text><text x="430" y="432" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#5a3a10" text-anchor="start" font-weight="600">Conclure</text><text x="408" y="454" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Que dis-je, limites ?</text><text x="408" y="472" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#42566b" text-anchor="start">la note d'EDA (1 page)</text><rect x="20" y="500" width="740" height="28" rx="4" fill="#eef4ea" stroke="#9db88f" stroke-width="1.2"/><text x="36" y="519" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#3d5a2e" text-anchor="start" font-weight="600">Les 3 jeux = 3 trajets : quincaillerie (les 10 étapes) · santé (arrive en C03) · scolaire (arrive en C05)</text><text x="20" y="541" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Le chronomètre (projet M09.P : 3 h) court sur les 10 étapes — la fiche d'entrée se remplit dans les 30 premières minutes.</text></svg>