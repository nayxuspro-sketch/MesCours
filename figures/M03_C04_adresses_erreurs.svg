<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><rect x="6" y="6" width="384" height="300" rx="4" fill="#fbfdff" stroke="#c9d3dd" stroke-width="1"/><text x="20" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600">Recopier vers le bas : ce qui bouge, ce qui reste</text><text x="-22" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="middle" font-weight="600">1</text><rect x="20" y="52" width="84" height="18" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="62" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="middle" font-weight="600">A</text><rect x="104" y="52" width="84" height="18" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="146" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="middle" font-weight="600">B</text><rect x="188" y="52" width="84" height="18" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="230" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="middle" font-weight="600">C</text><rect x="272" y="52" width="84" height="18" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="314" y="65" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="middle" font-weight="600">D</text><text x="10" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="middle" font-weight="600">1</text><rect x="20" y="78" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="62" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">taux TVA</text><rect x="104" y="78" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="146" y="95" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1,18</text><rect x="188" y="78" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><rect x="272" y="78" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="10" y="132" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="middle" font-weight="600">2</text><rect x="20" y="116" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="62" y="133" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ligne 2</text><rect x="104" y="116" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="146" y="133" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">48 015</text><rect x="188" y="116" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="230" y="133" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">=B2*$B$1</text><rect x="272" y="116" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="314" y="133" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">56 658</text><text x="10" y="170" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="middle" font-weight="600">3</text><rect x="20" y="154" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="62" y="171" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ligne 3</text><rect x="104" y="154" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="146" y="171" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">78 402</text><rect x="188" y="154" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="230" y="171" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="middle" font-weight="600">=B3*$B$1</text><rect x="272" y="154" width="84" height="26" rx="4" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="314" y="171" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">92 514</text><text x="20" y="194" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start">C3 est C2 recopiée : B2 → B3, $B$1 n'a pas bougé.</text><rect x="14" y="206" width="368" height="0.6" rx="4" fill="#dde3ea" stroke="#dde3ea" stroke-width="1"/><text x="20" y="224" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">B2 suit le déplacement · $B$1 reste · B$1 et $B2</text><text x="20" y="240" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">ne bloquent chacun qu'un seul bord.</text><text x="20" y="266" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">Règle du module : une donnée = une plage</text><text x="20" y="282" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">absolue, un calcul = une ligne relative. F4</text><text x="20" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="600">fait tourner les trois écritures.</text><rect x="398" y="6" width="352" height="300" rx="4" fill="#fff8f0" stroke="#e0a800" stroke-width="1"/><text x="396" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">Les erreurs, et ce qu'elles disent vraiment</text><text x="396" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">#N/A</text><text x="462" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">clé absente de la colonne cherchée</text><text x="396" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">#VALEUR!</text><text x="462" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">du texte là où un nombre est attendu</text><text x="396" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">#DIV/0!</text><text x="462" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">dénominateur nul, souvent un filtre actif</text><text x="396" y="164" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">#RÉF!</text><text x="462" y="164" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">la plage n'existe plus, ligne supprimée</text><text x="396" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">#NOM?</text><text x="462" y="200" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">fonction inconnue, nom anglais ou faute</text><text x="396" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#a1650b" text-anchor="start" font-weight="600">####</text><text x="462" y="236" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">pas une erreur : colonne trop étroite</text><text x="396" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#6b7785" text-anchor="start">Le tableur affiche ce qu'il a trouvé, rien de plus.</text></svg>