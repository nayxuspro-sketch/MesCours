<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="20" y="26" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="600">GROUP BY SQL et groupby pandas : la même chaîne de calcul</text><text x="20" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Deux syntaxes, une même sortie — les 5 magasins du socle, additionnés en centimes.</text><rect x="20" y="70" width="360" height="158" rx="4" fill="#ffffff" stroke="#5b7fa6" stroke-width="1.2"/><text x="36" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#12365a" text-anchor="start" font-weight="600">SQL — le moteur M07</text><text x="48" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#1f4e79" text-anchor="start">SELECT id_magasin,</text><text x="48" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#1f4e79" text-anchor="start" font-weight="600">SUM(montant_ttc)</text><text x="48" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#1f4e79" text-anchor="start">FROM vente</text><text x="48" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#1f4e79" text-anchor="start" font-weight="600">GROUP BY id_magasin</text><text x="48" y="198" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#1f4e79" text-anchor="start">ORDER BY 2 DESC;</text><rect x="400" y="70" width="360" height="158" rx="4" fill="#ffffff" stroke="#d99a6c" stroke-width="1.2"/><text x="416" y="92" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">pandas — C08, en centimes entiers</text><text x="416" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#7a3b12" text-anchor="start" font-weight="600">ct = (v["montant_ttc"] * 100)</text><text x="416" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#7a3b12" text-anchor="start">.round().astype("int64")</text><text x="416" y="158" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#7a3b12" text-anchor="start">ct.groupby(v["id_magasin"])</text><text x="416" y="178" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#7a3b12" text-anchor="start" font-weight="600">.sum() // 100</text><line x1="200" y1="228" x2="380" y2="252" stroke="#5b7fa6" stroke-width="1.4" marker-end="url(#f)"/><line x1="580" y1="228" x2="400" y2="252" stroke="#b3541e" stroke-width="1.4" marker-end="url(#f)"/><rect x="20" y="256" width="740" height="176" rx="4" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1"/><text x="380" y="280" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#12365a" text-anchor="middle" font-weight="600">la même sortie — CA par magasin (FCFA)</text><text x="310" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="middle" font-weight="600">id_magasin</text><text x="520" y="306" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="middle" font-weight="600">CA (FCFA)</text><rect x="290" y="300" width="40" height="20" rx="0" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><rect x="400" y="300" width="240" height="20" rx="0" fill="#fff7ef" stroke="#d99a6c" stroke-width="1"/><text x="310" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle" font-weight="600">4</text><text x="520" y="314" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle" font-weight="600">1 596 813 264</text><rect x="290" y="322" width="40" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><rect x="400" y="322" width="240" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="310" y="336" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle" font-weight="600">1</text><text x="520" y="336" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle">1 595 223 423</text><rect x="290" y="344" width="40" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><rect x="400" y="344" width="240" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="310" y="358" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle" font-weight="600">2</text><text x="520" y="358" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle">1 578 987 709</text><rect x="290" y="366" width="40" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><rect x="400" y="366" width="240" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="310" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle" font-weight="600">5</text><text x="520" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle">1 572 297 451</text><rect x="290" y="388" width="40" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><rect x="400" y="388" width="240" height="20" rx="0" fill="#ffffff" stroke="#c9d3dd" stroke-width="1"/><text x="310" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle" font-weight="600">3</text><text x="520" y="402" font-family="Inter, Segoe UI, sans-serif" font-size="9.5" fill="#12365a" text-anchor="middle">1 564 937 883</text><text x="380" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="middle" font-weight="600">top magasin : 4 — 1 596 813 264 FCFA (m08p_ca_top_magasin)</text><rect x="20" y="448" width="740" height="40" rx="4" fill="#fff7ef" stroke="#d99a6c" stroke-width="1.2"/><text x="36" y="466" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start" font-weight="600">Les centimes : additionner en entiers, diviser après l'agrégat —</text><text x="36" y="482" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7a3b12" text-anchor="start">la dérive float (1 à 2 FCFA sur 7,9 milliards) est mesurée et documentée, pas cachée.</text></svg>