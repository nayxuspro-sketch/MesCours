<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"><defs><marker id="f" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#1f4e79"/></marker></defs><text x="6" y="22" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#1f4e79" text-anchor="start" font-weight="600">Quatre familles de règles — rendement mesuré sur 243 360 lignes</text><text x="6" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Le nombre de lignes signalées ne dit rien de la qualité de la règle : la deuxième colonne si.</text><text x="16" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Famille</text><text x="150" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Règle</text><text x="360" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Signalées</text><text x="470" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start" font-weight="600">Erreurs réellement désignées</text><text x="700" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end" font-weight="600">Décision</text><rect x="6" y="66" width="768" height="40" rx="4" fill="#f2f7f2" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Domaine</text><text x="150" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">remise dans [0 ; 1]</text><text x="360" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">973 lignes</text><text x="470" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">973 erreurs désignées</text><text x="700" y="83" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="end">2 · corriger par reconstitution</text><text x="150" y="97" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start"></text><rect x="6" y="112" width="768" height="40" rx="4" fill="#eef3f8" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Seuil métier</text><text x="150" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">quantité au-dessus de 50</text><text x="360" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">800 lignes</text><text x="470" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">0 erreur — à surveiller</text><text x="700" y="129" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">3 · liste au magasin</text><text x="150" y="143" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start"></text><rect x="6" y="158" width="768" height="40" rx="4" fill="#f2f7f2" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Bande au référentiel</text><text x="150" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">prix dans [0,95 ; 1,35]</text><text x="360" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">0 ligne</text><text x="470" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">0 : le zéro est un résultat</text><text x="700" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#3f7d3f" text-anchor="end">3 · indicateur de dérive</text><text x="150" y="189" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start"></text><rect x="6" y="204" width="768" height="40" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Statistique (IQR)</text><text x="150" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Q1 - 1,5 IQR à Q3 + 1,5 IQR</text><text x="360" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">24 180 lignes</text><text x="470" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">0 erreur — bruit pur</text><text x="700" y="221" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">retirer du registre</text><text x="150" y="235" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start"></text><rect x="6" y="250" width="768" height="40" rx="4" fill="#fdf7f4" stroke="#c9a0a0" stroke-width="1"/><text x="16" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Égalité au catalogue</text><text x="150" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">prix = prix affiché</text><text x="360" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#7a3b12" text-anchor="start" font-weight="600">232 981 lignes</text><text x="470" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">0 erreur — règle fausse</text><text x="700" y="267" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="end">retirer du registre</text><text x="150" y="281" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start"></text><rect x="6" y="296" width="768" height="62" rx="4" fill="#f7fafc" stroke="#c9d3dd" stroke-width="1"/><text x="16" y="313" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1f4e79" text-anchor="start" font-weight="600">Le contrôle qui résiste à tout le monde : la réparation avant de corriger</text><text x="16" y="330" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">973 remises à 12, 18, 25 ou 30. Divisées par 100 : 258 lignes restent hors du plafond de 0,25.</text><text x="16" y="344" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Reconstituées depuis les montants : 0,000 à 0,110, les 973 dans le domaine. Le montant, lui, n'a jamais été faux.</text></svg>