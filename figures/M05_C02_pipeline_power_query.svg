Inter, Segoe UI, sans-serif" font-size="9" fill="#42566b" text-anchor="start">Table propre mars2025</text><rect x="20" y="290" width="740" height="100" rx="4" fill="#eef3f8" stroke="#1f4e79" stroke-width="1"/><text x="36" y="312" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1f4e79" text-anchor="start" font-weight="600">Verdict du fil rouge (mars 2025)</text><text x="36" y="332" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">6 884 lignes · total 464 096 003 FCFA · 101 enrichies · empreinte sha256 identique</text><text x="36" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#42566b" text-anchor="start">Rejouable : avril = 6 639 lignes, mai = 5 530 lignes, même schéma → même qualité.</text></svg>